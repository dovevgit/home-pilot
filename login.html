<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | כניסה</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
<div class="hero"><img class="logo" src="logo.png" alt="הבית שלנו - משימות הבית, ביחד ובקלות"></div>
<form class="card login-card" id="form" novalidate>
  <h2>ברוכים הבאים</h2>
  <label for="code">קוד בית</label>
  <input id="code" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" dir="ltr" maxlength="8" placeholder="למשל DK4821" required>
  <label for="email">שם משתמש</label>
  <input id="email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="שם המשתמש שלך" required>
  <label for="password">סיסמה</label>
  <input id="password" type="password" autocomplete="current-password" dir="ltr" placeholder="הסיסמה שלך" required>
  <button class="btn" id="submit" type="submit">התחברות</button>
  <p class="error" id="error" role="alert"></p>
  <p class="help" style="text-align:center">שכחתם סיסמה? ההורה יכול לאפס אותה.</p>
  <a class="btn secondary" href="signup.html" style="margin-top:6px">יצירת בית חדש</a>
</form>
<div class="ios-tip hidden" id="iosTip">להתקנה: שיתוף ← הוספה למסך הבית</div>
<script type="module">
import { supabase } from './js/supabase.js';
const { data } = await supabase.auth.getSession();
if (data.session) {
  try {
    if (!localStorage.getItem('myName') || !localStorage.getItem('myFam')) {
      const { data: pr } = await supabase.from('profiles').select('name,family_id').eq('id', data.session.user.id).maybeSingle();
      if (pr?.name) localStorage.setItem('myName', pr.name);
      if (pr?.family_id) localStorage.setItem('myFam', pr.family_id);
    }
  } catch (_) {}
  location.replace('index.html');
}

import { signIn, savedCode, saveCode } from './js/family.js';
document.getElementById('code').value = savedCode();
const form = document.getElementById('form');
const btn = document.getElementById('submit');
const err = document.getElementById('error');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'מתחבר...';
  const code = document.getElementById('code').value;
  const { error } = await signIn(code, document.getElementById('email').value, document.getElementById('password').value);
  if (error) {
    err.textContent = 'קוד בית, שם משתמש או סיסמה שגויים';
    btn.disabled = false; btn.textContent = 'התחברות';
  } else {
    saveCode(code);
    try {
      const { data: u } = await supabase.auth.getUser();
      const { data: pr } = await supabase.from('profiles').select('name,family_id').eq('id', u.user.id).maybeSingle();
      if (pr?.name) localStorage.setItem('myName', pr.name);
      if (pr?.family_id) localStorage.setItem('myFam', pr.family_id);
    } catch (_) {}
    location.replace('index.html');
  }
});

const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua);
const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
const standalone = window.navigator.standalone === true;
if (isIOS && isSafari && !standalone) document.getElementById('iosTip').classList.remove('hidden');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<script type="module">
import { initI18n, getLang, setLang } from './js/i18n.js';
initI18n('login');
const b = document.createElement('button'); b.type = 'button'; b.textContent = getLang() === 'en' ? 'עברית' : 'English';
b.style.cssText = 'position:fixed;top:12px;inset-inline-end:12px;z-index:50;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.92);color:#0A58CA;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)';
b.onclick = () => { setLang(getLang() === 'en' ? 'he' : 'en'); location.reload(); };
document.body.append(b);
</script>
</body>
</html>
