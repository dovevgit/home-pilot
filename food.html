<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | מה יש לאכול</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/home-favicon.png">
<link rel="apple-touch-icon" href="icons/home-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.fwrap{max-width:520px;margin:0 auto}
.ftray{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(31,41,55,.15);padding:10px 12px;margin-bottom:10px;min-height:84px;transition:box-shadow .15s}
.ftray h3{margin:0 0 6px;font-size:15px;color:#1F2937}
.ftray .chips{display:flex;flex-wrap:wrap;gap:6px}
.ftray .hint{font-size:13px;color:#6B7280;margin:0}
.fridge-box{position:relative;line-height:0;user-select:none;-webkit-user-select:none}
.fridge-box img{width:100%;display:block;border-radius:14px;pointer-events:none}
.fzone{position:absolute;display:flex;flex-wrap:wrap;align-content:flex-end;align-items:flex-end;gap:4px;padding:3px 4px 4px;box-sizing:border-box;overflow:hidden;line-height:1.2;border-radius:8px}
.fzone .zl{position:absolute;top:2px;inset-inline-start:6px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,40,.7);pointer-events:none}
.fzone.over,.ftray.over{outline:3px dashed #0D6EFD;background:rgba(13,110,253,.22)}
.fchip{display:inline-flex;align-items:center;gap:4px;max-width:46%;background:rgba(255,255,255,.95);border:2px solid #fff;border-radius:11px;padding:3px 8px;font-size:12px;font-weight:700;color:#1F2937;box-shadow:0 1px 3px rgba(0,0,0,.35);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:nowrap}
.ftray .fchip{max-width:100%;font-size:14px;padding:5px 10px}
.fchip span{overflow:hidden;text-overflow:ellipsis}
.fchip.warn{border-color:#F59E0B}
.fchip.old{border-color:#DC2626;background:#FEE2E2}
.fth{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;pointer-events:none}
.ftray .fth{width:30px;height:30px}
.fprev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:6px 0}
.fpbtns{display:flex;gap:8px}
.fpbtns .btn{flex:1;margin:0}
@keyframes fblink{0%,100%{border-color:#FF8A00;background:#FFD9A8;box-shadow:0 0 0 0 rgba(255,138,0,.85)}50%{border-color:#fff;background:rgba(255,255,255,.95);box-shadow:0 0 0 8px rgba(255,138,0,0)}}
.fchip.fresh{animation:fblink 1.1s ease-in-out infinite}
.fstar{font-size:11px;color:#B45309;font-weight:800}
.frev{background:#F9FAFB;border-radius:12px;padding:8px 10px;margin:6px 0;line-height:1.5}
.frev .rn{font-weight:800}.frev .rs{color:#F59E0B;letter-spacing:1px}.frev .rc{font-size:14px;color:#374151}
.fstars{display:flex;gap:6px;margin:6px 0}
.fstars button{border:0;background:#F3F4F6;border-radius:10px;font-size:26px;width:44px;height:44px;color:#D1D5DB}
.fstars button.on{color:#F59E0B;background:#FEF3C7}
.fsum{font-weight:800;margin:4px 0}
.fsec{border-top:1px solid #E5E7EB;margin-top:14px;padding-top:6px}
.fslots{display:flex;gap:8px;margin:6px 0}
.fslot{position:relative;flex:1;height:88px;box-sizing:border-box;border-radius:12px;border:2px dashed #CBD5E1;background:#F8FAFC;display:flex;align-items:center;justify-content:center;font-size:28px;color:#94A3B8;overflow:hidden;padding:0}
.fslot img{width:100%;height:100%;object-fit:cover;display:block}
.fslot.sel{border:3px solid #0D6EFD}
.fslot .mainbadge{position:absolute;top:3px;inset-inline-start:3px;background:#F59E0B;color:#fff;border-radius:8px;font-size:11px;font-weight:800;padding:1px 6px}
.fchip.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;transform:scale(1.12);max-width:none}
.fchip.src{opacity:.3}
#add{margin-top:14px}
</style>
</head>
<body>
<main>
  <div class="fwrap">
    <div class="ftray" data-zone="__tray"><h3>אוכל מוכן</h3><div class="chips" id="tray"></div></div>
    <div class="fridge-box" id="fridge"><img src="fridge-food.jpg" alt="המקרר" draggable="false"></div>
    <button class="btn" id="add" type="button">הוספת אוכל חדש</button>
  </div>
</main>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, showToast, ilDate } from './js/common.js';
const OWNER_FAMILY = '40f12cb3-3fa9-4f99-a7fd-ad5a10e00b80';
const { me, profiles } = await initPage({ active: 'food', title: 'מה יש לאכול', back: 'index.html' });
// בשלב הזה המסך פתוח רק לבית של הבעלים
if (me?.family_id !== OWNER_FAMILY) { location.replace('index.html'); await new Promise(() => {}); }
const $ = id => document.getElementById(id);
let locs = [], items = [], seen = new Set(), avg = {};
const nameOf = id => (profiles || []).find(p => p.id === id)?.name || 'מישהו';
const starsTxt = n => '★'.repeat(n) + '☆'.repeat(5 - n);
// אזורי השחרור על תמונת המקרר (באחוזים מהתמונה): [שמאל, למעלה, רוחב, גובה]
const ZONES = {
  'מדף עליון': [14, 16.2, 72, 7.5],
  'מדף אמצעי': [14, 24.3, 72, 9.7],
  'מדף תחתון': [14, 34.5, 72, 9.5],
  'מגירת ירקות': [14, 47.2, 72, 16.9],
  'מקפיא': [5, 70.1, 90, 28]
};
const today = () => ilDate(new Date());
function daysLeft(eatBy) {
  if (!eatBy) return null;
  return Math.round((new Date(eatBy + 'T00:00:00Z') - new Date(today() + 'T00:00:00Z')) / 86400000);
}
const fmt = d => { if (!d) return ''; const [, m, dd] = d.split('-'); return dd + '.' + m; };

const urls = {};
async function signFood(paths) {
  const now = Date.now(); let cache = {};
  try { cache = JSON.parse(localStorage.getItem('foodSgn') || '{}'); } catch (_) {}
  const need = [];
  [...new Set((paths || []).filter(Boolean))].forEach(p => { const c = cache[p]; if (c && c[1] > now) urls[p] = c[0]; else need.push(p); });
  if (need.length) {
    const { data } = await supabase.storage.from('food-photos').createSignedUrls(need, 604800);
    (data || []).forEach(sg => { if (sg.path && sg.signedUrl) { urls[sg.path] = sg.signedUrl; cache[sg.path] = [sg.signedUrl, now + 6 * 864e5]; } });
    Object.keys(cache).forEach(k => { if (cache[k][1] < now) delete cache[k]; });
    try { localStorage.setItem('foodSgn', JSON.stringify(cache)); } catch (_) {}
  }
}
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

async function load() {
  const [l, i, sn, rv] = await Promise.all([
    supabase.from('food_locations').select('*').order('sort_order'),
    supabase.from('food_items').select('*').eq('status', 'available').order('created_at'),
    supabase.from('food_seen').select('item_id'),
    supabase.from('food_reviews').select('item_id,rating')
  ]);
  avg = {};
  if (!rv.error) { const t = {}; (rv.data || []).forEach(x => { if (x.rating) { (t[x.item_id] = t[x.item_id] || []).push(x.rating); } }); for (const k in t) avg[k] = t[k].reduce((a, b) => a + b, 0) / t[k].length; }
  if (!sn.error) seen = new Set((sn.data || []).map(x => x.item_id));
  if (l.error || i.error) { showToast('לא הצלחנו לטעון', true); return; }
  locs = l.data || []; items = i.data || [];
  try { await signFood(items.flatMap(x => [...(x.photo_paths || []), x.photo_path])); } catch (_) {}
  render();
}

function chip(r) {
  const d = daysLeft(r.eat_by);
  const cls = d !== null && d < 0 ? ' old' : d !== null && d <= 2 ? ' warn' : '';
  const fresh = seen.has(r.id) ? '' : ' fresh';
  return `<div class="fchip${cls}${fresh}" data-id="${r.id}">${r.photo_path && urls[r.photo_path] ? `<img class="fth" src="${esc(urls[r.photo_path])}" alt="" draggable="false">` : '🥘'}<span>${esc(r.name)}</span>${avg[r.id] ? `<b class="fstar">★${avg[r.id].toFixed(1).replace('.0', '')}</b>` : ''}</div>`;
}

function render() {
  const zoneOf = r => { const l = locs.find(x => x.id === r.location_id); return l && ZONES[l.name] ? l.name : null; };
  $('tray').innerHTML = items.filter(r => !zoneOf(r)).map(chip).join('') || '<p class="hint">הכול כבר במקרר. הוסיפו אוכל חדש בכפתור שמתחת.</p>';
  const box = $('fridge');
  box.querySelectorAll('.fzone').forEach(z => z.remove());
  for (const l of locs) {
    const z = ZONES[l.name]; if (!z) continue;
    const el = document.createElement('div');
    el.className = 'fzone'; el.dataset.zone = l.id;
    el.style.cssText = `left:${z[0]}%;top:${z[1]}%;width:${z[2]}%;height:${z[3]}%`;
    el.innerHTML = `<span class="zl">${esc(l.name)}</span>` + items.filter(r => r.location_id === l.id).map(chip).join('');
    box.append(el);
  }
}

// גרירה באצבע או בעכבר. לחיצה קצרה בלי גרירה פותחת את פרטי האוכל
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.fchip'); if (!c || c.classList.contains('ghost') || e.button) return;
  drag = { id: c.dataset.id, el: c, x: e.clientX, y: e.clientY, on: false, ghost: null, zone: null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
    drag.on = true;
    const g = drag.el.cloneNode(true); g.classList.add('ghost'); document.body.append(g); drag.ghost = g;
    drag.el.classList.add('src');
  }
  const g = drag.ghost; g.style.left = (e.clientX - g.offsetWidth / 2) + 'px'; g.style.top = (e.clientY - g.offsetHeight / 2) + 'px';
  const z = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-zone]') || null;
  if (z !== drag.zone) { drag.zone?.classList.remove('over'); z?.classList.add('over'); drag.zone = z; }
  e.preventDefault();
}, { passive: false });
async function endDrag(cancel) {
  const d = drag; drag = null; if (!d) return;
  if (!d.on) { if (!cancel) openForm(items.find(x => x.id === d.id)); return; }
  d.ghost.remove(); d.el.classList.remove('src'); d.zone?.classList.remove('over');
  if (cancel || !d.zone) return;
  const r = items.find(x => x.id === d.id); if (!r) return;
  const target = d.zone.dataset.zone === '__tray' ? null : d.zone.dataset.zone;
  if ((r.location_id || null) === target) return;
  const prev = r.location_id; r.location_id = target; render();
  const { error } = await supabase.from('food_items').update({ location_id: target, updated_at: new Date().toISOString() }).eq('id', r.id);
  if (error) { r.location_id = prev; render(); showToast('ההעברה נכשלה', true); }
}
document.addEventListener('dragstart', e => { if (e.target.closest?.('.fchip')) e.preventDefault(); });
document.addEventListener('pointerup', () => endDrag(false));
document.addEventListener('pointercancel', () => endDrag(true));

function close() { $('modal').classList.add('hidden'); render(); }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) close(); });

async function markSeen(r) {
  if (!r || !r.id || seen.has(r.id)) return;
  seen.add(r.id);
  const { error } = await supabase.from('food_seen').upsert({ item_id: r.id }, { onConflict: 'item_id,user_id', ignoreDuplicates: true });
  if (error) seen.delete(r.id);
}
async function reviewsUi(r) {
  const box = $('fRev'); if (!box) return;
  const { data, error } = await supabase.from('food_reviews').select('*').eq('item_id', r.id).order('created_at');
  if (error) { box.innerHTML = ''; return; }
  const rows = data || [], mine = rows.find(x => x.user_id === me.id);
  const rated = rows.filter(x => x.rating), av = rated.length ? rated.reduce((a, x) => a + x.rating, 0) / rated.length : null;
  const iCooked = r.cook_id === me.id;
  let draft = mine?.rating || 0;
  box.innerHTML = `<h3 style="margin:8px 0 4px">דירוג והערות</h3>
    ${r.cook_id ? `<div class="note">הוכן על ידי ${esc(nameOf(r.cook_id))}</div>` : ''}
    ${av ? `<div class="fsum">★ ${av.toFixed(1).replace('.0', '')} (${rated.length} דירוגים)</div>` : '<div class="note">עוד אין דירוגים</div>'}
    ${rows.map(x => `<div class="frev"><span class="rn">${esc(nameOf(x.user_id))}</span> ${x.rating ? `<span class="rs">${starsTxt(x.rating)}</span>` : ''}${x.comment ? `<div class="rc">${esc(x.comment)}</div>` : ''}</div>`).join('')}
    ${iCooked ? '<div class="note">אתה הכנת את האוכל הזה, אז אי אפשר לדרג אותו.</div>' : `<label>הדירוג שלי</label>
      <div class="fstars" id="fStars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= draft ? 'on' : ''}" aria-label="${n}">★</button>`).join('')}</div>
      <textarea id="fComment" maxlength="500" rows="2" placeholder="הערה (לא חובה)">${esc(mine?.comment || '')}</textarea>
      <button class="btn secondary" id="fRevSave" type="button">שמירת הדירוג שלי</button>
      ${mine ? '<button class="btn secondary" id="fRevDel" type="button">מחיקת הדירוג שלי</button>' : ''}`}`;
  if (iCooked) return;
  $('fStars').onclick = e => { const b = e.target.closest('button'); if (!b) return; draft = draft === +b.dataset.n ? 0 : +b.dataset.n; $('fStars').querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= draft)); };
  $('fRevSave').onclick = async () => {
    const comment = $('fComment').value.trim() || null;
    if (!draft && !comment) { showToast('בחרו כוכבים או כתבו הערה', true); return; }
    const { error } = await supabase.from('food_reviews').upsert({ item_id: r.id, rating: draft || null, comment, updated_at: new Date().toISOString() }, { onConflict: 'item_id,user_id' });
    if (error) { showToast('השמירה נכשלה', true); return; }
    showToast('הדירוג נשמר'); load(); await reviewsUi(r);
  };
  if (mine) $('fRevDel').onclick = async () => {
    if (!confirm('למחוק את הדירוג וההערה שלך?')) return;
    const { error } = await supabase.from('food_reviews').delete().eq('item_id', r.id).eq('user_id', me.id);
    if (error) { showToast('המחיקה נכשלה', true); return; }
    load(); await reviewsUi(r);
  };
}
function openForm(r) {
  markSeen(r);
  r = r || { name: '', container: '', portions: '', made_on: today(), eat_by: '', notes: '', location_id: '' };
  $('modalCard').innerHTML = `<button type="button" class="modal-x" id="mx" aria-label="סגירה">${icon('x', 20)}</button>
    <h2 style="margin:0 0 6px">${r.id ? 'עריכת אוכל' : 'הוספת אוכל'}</h2>
    <label>מה האוכל</label><input id="fName" maxlength="80" value="${esc(r.name)}" placeholder="למשל: מרק עוף">
    <label>איפה הוא נמצא</label><select id="fLoc"><option value="">ללא מקום (במגש)</option>${locs.filter(l => ZONES[l.name]).map(l => `<option value="${l.id}" ${l.id === r.location_id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>
    <label>באיזה מכל (לא חובה)</label><input id="fCont" maxlength="60" value="${esc(r.container || '')}" placeholder="למשל: קופסה כחולה גדולה">
    <label>כמה מנות (לא חובה)</label><input id="fPort" type="number" inputmode="numeric" min="1" max="50" value="${r.portions ?? ''}">
    <label>הוכן בתאריך</label><input id="fMade" type="date" value="${r.made_on || ''}">
    <label>לאכול עד (לא חובה)</label><input id="fEat" type="date" value="${r.eat_by || ''}">
    <label>הערה (לא חובה)</label><input id="fNotes" maxlength="200" value="${esc(r.notes || '')}">
    <label>מי הכין (לא חובה)</label><select id="fCook"><option value="">לא צוין</option>${(profiles || []).map(p => `<option value="${p.id}" ${p.id === r.cook_id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <label>תמונות של האוכל, עד 3 (לא חובה)</label>
    <div class="note">כדאי לצלם גם את הכלי וגם את המנה. מסמנים איזו תמונה תופיע במקרר.</div>
    <img class="fprev hidden" id="fPrev" alt="">
    <div class="fslots" id="fSlots"></div>
    <div class="fpbtns" id="fSlotBtns"></div>
    <input type="file" id="fFile" accept="image/*" class="hidden">
    <button class="btn" id="fSave" type="button">שמירה</button>
    ${r.id ? '<div class="fsec" id="fRev"></div>' : ''}
    ${r.id ? `<button class="btn secondary" id="fFin" type="button">נגמר, להוריד מהמקרר</button><button class="btn secondary" id="fDel" type="button" style="color:#991B1B;border-color:#991B1B">מחיקה</button>` : ''}`;
  $('modal').classList.remove('hidden');
  $('mx').onclick = close;
  // תמונות: עד 3, אחת מהן מסומנת כתמונה שמופיעה במקרר
  const origPaths = (r.photo_paths && r.photo_paths.length ? r.photo_paths : (r.photo_path ? [r.photo_path] : []));
  let slots = origPaths.map(path => ({ path, url: urls[path] || null }));
  let main = slots.find(x => x.path === r.photo_path) || slots[0] || null;
  let sel = 0, pickFor = null;
  const drawPhotos = () => {
    if (sel >= slots.length) sel = Math.max(0, slots.length - 1);
    const cur = slots[sel];
    $('fPrev').classList.toggle('hidden', !cur?.url); if (cur?.url) $('fPrev').src = cur.url;
    $('fSlots').innerHTML = [0, 1, 2].map(i => slots[i]
      ? `<button type="button" class="fslot ${i === sel ? 'sel' : ''}" data-i="${i}">${slots[i].url ? `<img src="${esc(slots[i].url)}" alt="">` : '🖼️'}${slots[i] === main ? '<span class="mainbadge">במקרר</span>' : ''}</button>`
      : `<button type="button" class="fslot" data-add="1" aria-label="הוספת תמונה">+</button>`).join('');
    $('fSlotBtns').innerHTML = cur ? `${cur !== main ? '<button class="btn secondary" id="fMain" type="button">זו תופיע במקרר</button>' : ''}<button class="btn secondary" id="fRepl" type="button">החלפה</button><button class="btn secondary" id="fRem" type="button">הסרה</button>` : '';
    if (cur) {
      if ($('fMain')) $('fMain').onclick = () => { main = cur; drawPhotos(); };
      $('fRepl').onclick = () => { pickFor = sel; $('fFile').click(); };
      $('fRem').onclick = () => { slots.splice(sel, 1); if (main === cur) main = slots[0] || null; drawPhotos(); };
    }
  };
  $('fSlots').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.add) { pickFor = slots.length; $('fFile').click(); } else { sel = +b.dataset.i; drawPhotos(); }
  };
  drawPhotos();
  if (r.id) reviewsUi(r);
  $('fFile').onchange = async () => {
    const f = $('fFile').files[0]; if (!f) return;
    try {
      const blob = await shrink(f), ns = { blob, url: URL.createObjectURL(blob) };
      if (pickFor !== null && pickFor < slots.length) { const old = slots[pickFor]; slots[pickFor] = ns; if (main === old) main = ns; }
      else if (slots.length < 3) { slots.push(ns); pickFor = slots.length - 1; }
      if (!main) main = ns;
      sel = slots.indexOf(ns); drawPhotos();
    } catch (_) { showToast('לא הצלחנו לקרוא את התמונה', true); }
    $('fFile').value = '';
  };
  $('fSave').onclick = async () => {
    const p = parseInt($('fPort').value);
    const row = { name: $('fName').value.trim(), location_id: $('fLoc').value || null, container: $('fCont').value.trim() || null,
      portions: Number.isFinite(p) && p > 0 ? p : null, made_on: $('fMade').value || null, eat_by: $('fEat').value || null, notes: $('fNotes').value.trim() || null, cook_id: $('fCook').value || null };
    if (!row.name) { showToast('חסר שם לאוכל', true); return; }
    $('fSave').disabled = true;
    const uploaded = [];
    for (const sl of slots) {
      if (!sl.blob) continue;
      const path = `${me.family_id}/${crypto.randomUUID()}.jpg`;
      const up = await supabase.storage.from('food-photos').upload(path, sl.blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) {
        if (uploaded.length) { try { await supabase.storage.from('food-photos').remove(uploaded); } catch (_) {} }
        showToast('העלאת התמונה נכשלה', true); $('fSave').disabled = false; return;
      }
      sl.path = path; uploaded.push(path);
    }
    row.photo_paths = slots.map(x => x.path);
    row.photo_path = main ? main.path : null;
    const { error } = r.id ? await supabase.from('food_items').update({ ...row, updated_at: new Date().toISOString() }).eq('id', r.id) : await supabase.from('food_items').insert(row);
    if (error) {
      if (uploaded.length) { try { await supabase.storage.from('food-photos').remove(uploaded); } catch (_) {} }
      showToast('השמירה נכשלה', true); $('fSave').disabled = false; return;
    }
    const gone = origPaths.filter(x => !row.photo_paths.includes(x));
    if (gone.length) { try { await supabase.storage.from('food-photos').remove(gone); } catch (_) {} }
    close(); await load();
  };
  if (r.id) $('fFin').onclick = async () => {
    const { error } = await supabase.from('food_items').update({ status: 'finished', updated_at: new Date().toISOString() }).eq('id', r.id);
    if (error) { showToast('העדכון נכשל', true); return; }
    close(); await load();
  };
  if (r.id) $('fDel').onclick = async () => {
    if (!confirm('למחוק את "' + r.name + '"?')) return;
    const { error } = await supabase.from('food_items').delete().eq('id', r.id);
    if (error) { showToast('המחיקה נכשלה', true); return; }
    if (origPaths.length) { try { await supabase.storage.from('food-photos').remove(origPaths); } catch (_) {} }
    close(); await load();
  };
}
$('add').onclick = () => openForm();
await load();
</script>
</body>
</html>
