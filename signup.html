<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | יצירת בית</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/home-favicon.png">
<link rel="apple-touch-icon" href="icons/home-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
<div class="hero"><img class="logo" src="logo.png" alt="הבית שלנו"></div>
<div class="card login-card" id="form">
  <h2>יצירת בית חדש</h2>
  <button class="btn" id="google" type="button">הרשמה עם Google</button>
  <p class="error" id="error" role="alert"></p>
  <p class="help" style="text-align:center;margin-top:12px"><a href="privacy.html">מדיניות פרטיות</a> · <a href="terms.html">תנאי שימוש</a></p>
  <a class="btn secondary" href="login.html" style="margin-top:6px">יש לי כבר בית</a>
</div>
<script type="module">
import { googleSignIn } from './js/family.js';
const $ = id => document.getElementById(id);
$('google').addEventListener('click', async () => {
  $('error').textContent = '';
  const { error } = await googleSignIn();
  if (error) $('error').textContent = 'ההתחברות עם Google נכשלה, נסו שוב';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<script type="module">
import { initI18n, getLang, setLang } from './js/i18n.js';
initI18n('signup');
const b = document.createElement('button'); b.type = 'button'; b.textContent = getLang() === 'en' ? 'עברית' : 'English';
b.style.cssText = 'position:fixed;top:12px;inset-inline-end:12px;z-index:50;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.92);color:#0A58CA;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)';
b.onclick = () => { setLang(getLang() === 'en' ? 'he' : 'en'); location.reload(); };
document.body.append(b);
</script>
</body>
</html>
