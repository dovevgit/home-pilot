<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | הודעות</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="chatpage">
<main id="msgs"><p class="empty">טוען...</p></main>
<form class="composer" id="form" autocomplete="off">
  <label class="cbtn" for="photo" aria-label="בחירת תמונה מהגלריה" id="photoBtn"></label>
  <input type="file" id="photo" accept="image/*" hidden>
  <label class="cbtn" for="camera" aria-label="צילום תמונה" id="cameraBtn"></label>
  <input type="file" id="camera" accept="image/*" capture="environment" hidden>
  <button class="cbtn" id="emoBtn" type="button" aria-label="אימוג'ים זזים">😊</button>
  <input id="text" type="text" placeholder="כתבו הודעה..." maxlength="500" enterkeyhint="send">
  <button class="cbtn send" id="send" type="submit" aria-label="שליחה"></button>
</form>
<div id="emoPanel" class="emo-panel hidden" role="dialog" aria-label="אימוג'ים זזים"></div>
<style>
.emo-panel{position:fixed;inset-inline:8px;bottom:calc(72px + env(safe-area-inset-bottom));background:#fff;border:1px solid var(--border,#ddd);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;max-height:42vh;overflow:auto;z-index:50}
.emo-panel.hidden{display:none}
#emoBtn{font-size:26px;line-height:1}
.emo-panel button{border:0;background:none;font-size:32px;line-height:1;padding:6px;border-radius:12px;cursor:pointer}
.emo-panel button:active{background:var(--bg)}
.aemo{width:1.5em;height:1.5em;vertical-align:-.35em;display:inline-block}
.aemo.big{width:64px;height:64px;vertical-align:middle}
</style>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, avatar, ilDate, ilTime, addDays, flashToast, showToast, shrinkImage, signedUrls, playChime } from './js/common.js';
document.getElementById('send').innerHTML = icon('send', 22);
const { session, profiles } = await initPage({ active: 'chat', title: 'הודעות משפחתיות', back: 'index.html' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const me = session.user.id;
const $ = id => document.getElementById(id);
$('photoBtn').innerHTML = icon('image', 24);
$('cameraBtn').innerHTML = icon('camera', 24);
const today = ilDate(new Date());
// אימוג'ים זזים (Google Noto Animated Emoji, רישיון CC BY 4.0): בהודעה נשמר תו האימוג'י הרגיל, ובתצוגה מוחלף בתמונה זזה. אם התמונה לא נטענת, נשאר האימוג'י הרגיל.
const AEMO = ['😀','😂','🥰','😍','😎','🤩','😉','😋','😜','🤔','😴','😭','😡','🥳','😱','🤗','🙏','👍','👏','🙌','💪','👋','❤️','🔥','✨','🎉','🎂','🎈','⭐','💯','☀️','🌈','🍕','🍦','⚽','🎮','🏆','🐶','🐱'];
const aeCode = c => [...c].map(x => x.codePointAt(0).toString(16)).join('_');
const aeRe = new RegExp(AEMO.slice().sort((a, b) => b.length - a.length).join('|'), 'g');
const aeImg = (c, big) => `<img class="aemo${big ? ' big' : ''}" src="https://fonts.gstatic.com/s/e/notoemoji/latest/${aeCode(c)}/512.webp" alt="${c}" loading="lazy" onerror="this.replaceWith(document.createTextNode(this.alt))">`;
function bodyHtml(t) {
  const only = t.replace(aeRe, '').trim() === '' && (t.match(aeRe) || []).length <= 3;
  return esc(t).replace(aeRe, c => aeImg(c, only));
}
let list = [], urls = {}, busy = false;

const dayLabel = d => d === today ? 'היום' : d === addDays(today, -1) ? 'אתמול' : d.split('-').reverse().join('.');

async function signFor(rows) {
  const need = rows.map(m => m.photo_path).filter(p => p && !urls[p]);
  if (!need.length) return;
  Object.assign(urls, await signedUrls(need));
}
function render(scroll) {
  const box = $('msgs');
  const nearEnd = scroll || (window.innerHeight + window.scrollY >= document.body.scrollHeight - 140);
  if (!list.length) { box.innerHTML = '<p class="empty">אין הודעות עדיין. כתבו הודעה ראשונה!</p>'; return; }
  let last = '';
  box.innerHTML = list.map(m => {
    const at = new Date(m.created_at); const d = ilDate(at);
    const sep = d !== last ? `<div class="daysep">${dayLabel(d)}</div>` : ''; last = d;
    const time = `<span class="mtime" dir="ltr">${ilTime(at)}</span>`;
    if (m.type === 'system') return `${sep}<div class="sysmsg"><small>הודעת מערכת</small>${esc(m.body)} ${time}</div>`;
    const mine = m.user_id === me; const who = byId[m.user_id];
    const img = m.photo_path && urls[m.photo_path] ? `<img class="mimg" src="${urls[m.photo_path]}" alt="תמונה" data-src="${urls[m.photo_path]}">` : '';
    return `${sep}<div class="msg ${mine ? 'mine' : ''}">${avatar(who, 36)}
      <div class="bubble">${mine ? '' : `<b>${esc(who?.name || 'מישהו')}</b>`}${img}${m.body ? `<div>${bodyHtml(m.body)}</div>` : ''}${time}</div></div>`;
  }).join('');
  if (nearEnd) window.scrollTo(0, document.body.scrollHeight);
}
async function load(scroll) {
  const { data, error } = await supabase.from('feed').select('*').in('type', ['chat', 'system']).order('created_at', { ascending: false }).limit(100);
  if (error) { if (!list.length) $('msgs').innerHTML = '<p class="empty">לא הצלחנו לטעון הודעות</p>'; return; }
  const rows = (data || []).slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  await signFor(rows);
  const changed = rows.length !== list.length || (rows.at(-1)?.id !== list.at(-1)?.id);
  { const nw = rows.at(-1); if (list.length && nw && nw.id !== list.at(-1)?.id && nw.user_id !== me && nw.type !== 'system') playChime(); }
  list = rows;
  if (changed || scroll) render(scroll);
  try { localStorage.setItem('chatSeen', new Date().toISOString()); } catch (_) {}
}

$('emoPanel').innerHTML = AEMO.map(c => `<button type="button" data-e="${c}">${c}</button>`).join('');
$('emoBtn').addEventListener('click', () => $('emoPanel').classList.toggle('hidden'));
$('emoPanel').addEventListener('click', e => {
  const b = e.target.closest('[data-e]'); if (!b) return;
  const t = $('text');
  if ((t.value + b.dataset.e).length > 500) return;
  t.value += b.dataset.e;
});
document.addEventListener('click', e => { if (!e.target.closest('#emoPanel') && !e.target.closest('#emoBtn')) $('emoPanel').classList.add('hidden'); });
$('msgs').addEventListener('click', e => {
  const i = e.target.closest('.mimg'); if (!i) return;
  $('modalCard').innerHTML = `<button type="button" class="modal-x" id="mx" aria-label="סגירה">${icon('x', 22)}</button><img class="zoom" src="${i.dataset.src}" alt="">`;
  $('modal').classList.remove('hidden'); $('mx').onclick = () => $('modal').classList.add('hidden');
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });

async function post(row) {
  if (busy) return; busy = true; $('send').disabled = true;
  const { error } = await supabase.from('feed').insert({ type: 'chat', user_id: me, ...row });
  busy = false; $('send').disabled = false;
  if (error) { showToast('השליחה נכשלה, אפשר לנסות שוב', true); return false; }
  await load(true); return true;
}
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = $('text').value.trim(); if (!body) return;
  $('text').value = '';
  if (!(await post({ body }))) $('text').value = body;
});
for (const id of ['photo', 'camera']) $(id).addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    showToast('מעלה תמונה...');
    const blob = await shrinkImage(f);
    const path = `reports/${me}/chat-${crypto.randomUUID()}.jpg`;
    const up = await supabase.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw new Error('upload');
    await post({ photo_path: path, body: $('text').value.trim() || null }); $('text').value = '';
  } catch (_) { showToast('העלאת התמונה נכשלה', true); }
});

await load(true);
// זמן אמת על feed בלבד (הודעות צ'אט ומערכת). גיבוי: רענון כל 8 שניות.
try {
  supabase.channel('feed-chat')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'feed', filter: 'type=in.(chat,system)' }, () => load(false))
    .subscribe();
} catch (_) {}
setInterval(() => { if (!document.hidden) load(false); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
</script>
</body>
</html>
