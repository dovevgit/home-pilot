<html lang="he" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" type="image/png" href="icons/favicon.png">

<style>
.aipick{display:flex;flex-direction:column;gap:14px;padding:18px 14px}
.aipick button{border:3px solid var(--border,#ddd);background:#fff;border-radius:22px;padding:22px 14px;font:inherit;cursor:pointer;text-align:center;box-shadow:0 2px 8px rgba(31,41,55,.08)}
.aipick button:active{background:var(--bg)}
.aipick .aipi{font-size:54px;line-height:1}.aipick .aitt{display:block;font-size:24px;font-weight:800;margin-top:6px}.aipick .aipd{display:block;color:var(--muted,#667);font-size:16px;margin-top:4px}
.hidden{display:none!important}
.aihint{margin:8px 12px 0;color:var(--muted,#667);font-size:15px;text-align:center}
#msgs{padding:12px}
.msg.bot .bubble{background:#fff;white-space:pre-wrap}
.msg.mine .bubble{white-space:pre-wrap}
.aiav{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;box-shadow:0 2px 6px rgba(31,41,55,.08)}
.typing{opacity:.6}
.sharebtn{display:flex;width:max-content;align-items:center;gap:6px;margin:10px 0 0;border:0;background:#22A84B;color:#fff;box-shadow:0 3px 0 #167532;border-radius:999px;padding:8px 16px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.saybtn{display:flex;width:max-content;align-items:center;gap:6px;margin:8px 0 0;border:2px solid var(--blue,#0D6EFD);background:#fff;color:var(--blue-dark,#0A58CA);border-radius:999px;padding:6px 14px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;direction:ltr}
.aisug{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.aisug button{border:2px solid var(--blue,#0D6EFD);background:#fff;color:var(--blue-dark,#0A58CA);border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}

/* מסך המורה: לוח כיתה וכפתורים גדולים */
body.teacher #hint{display:none}
body.teacher #msgs{padding:12px 12px 0}
.tboard{border-radius:18px;padding:10px;background:linear-gradient(135deg,#C48A4A,#8E5B27);box-shadow:0 8px 18px rgba(80,45,10,.35)}
.tin{border-radius:10px;padding:16px 16px 14px;background:radial-gradient(ellipse at 30% 15%,#3F7A66 0,#2E5E4E 55%,#244B3E 100%);box-shadow:inset 0 0 28px rgba(0,0,0,.35);color:#F7F5EC;display:flex;flex-direction:column;gap:12px}
.tledge{height:8px;margin:6px 24px 0;border-radius:4px;background:#F2E6CF;box-shadow:0 2px 3px rgba(0,0,0,.25)}
.ttitle{text-align:center}
.ttitle .en{font-family:'Amatic SC',cursive;font-weight:700;font-size:54px;line-height:.95;letter-spacing:1px;color:#FFE066;direction:ltr}
.ttitle .ln{width:70%;height:4px;margin:8px auto 4px;border-radius:4px;background:#F7F5EC;opacity:.75}
.tchalk{font-size:24px;font-weight:700;line-height:1.35;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}
.tword{text-align:center}
.tword .w{font-family:'Amatic SC',cursive;font-weight:700;font-size:104px;line-height:.9;letter-spacing:2px;color:#FFE066;direction:ltr;overflow-wrap:anywhere}
.tword .u{width:60%;height:4px;margin:6px auto 0;border-radius:4px;background:#FFE066;opacity:.7}
.tsay{align-self:center;border:0;border-radius:999px;padding:0 26px;height:62px;background:linear-gradient(180deg,#fff,#E7EEF9);box-shadow:0 5px 0 #A9B8D0;color:#0A58CA;font:inherit;font-size:23px;font-weight:800;display:flex;align-items:center;gap:12px;cursor:pointer}
.tsay:active{transform:translateY(3px);box-shadow:0 2px 0 #A9B8D0}
.tnote{align-self:flex-start;max-width:80%;transform:rotate(-2deg);background:#FFF3A8;color:#4A3B00;font-size:22px;font-weight:700;padding:10px 18px;border-radius:6px;box-shadow:0 4px 8px rgba(0,0,0,.35);white-space:pre-wrap;overflow-wrap:anywhere}
.tbig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:92px;gap:12px;margin:16px 0 8px}
.tbig button{border:0;border-radius:22px;color:#fff;font:inherit;font-size:22px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tbig button:active{transform:translateY(4px)}
.tbig .c1{background:linear-gradient(180deg,#FFB05C,#FF8A1F);box-shadow:0 6px 0 #C4640A}
.tbig .c2{background:linear-gradient(180deg,#A78BFF,#7451EB);box-shadow:0 6px 0 #4B2FB3}
.tbig .c3{background:linear-gradient(180deg,#52D87A,#22A84B);box-shadow:0 6px 0 #167532}
.tbig .c4{background:linear-gradient(180deg,#4C9BFF,#0D6EFD);box-shadow:0 6px 0 #0A47A8}
.tbig .c5{grid-column:1/-1;background:#fff;color:#34425E;border:3px solid #B9C7DD;box-shadow:0 5px 0 #B9C7DD;font-size:21px}
.tboard.run .tin{min-height:calc(100dvh - 300px)}
.tfinish{display:block;margin:6px auto 4px;border:0;border-radius:999px;padding:0 28px;height:54px;background:linear-gradient(180deg,#FFB05C,#FF8A1F);box-shadow:0 5px 0 #C4640A;color:#fff;font:inherit;font-size:20px;font-weight:800;cursor:pointer}
.tfinish:active{transform:translateY(3px);box-shadow:0 2px 0 #C4640A}
.finask{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.finbox{background:#fff;border-radius:24px;padding:26px 20px 20px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.finq{font-size:24px;font-weight:800;line-height:1.35;margin-bottom:18px;color:#1F2A44}
.finbox button{display:block;width:100%;border:0;border-radius:18px;height:58px;font:inherit;font-size:21px;font-weight:800;cursor:pointer;margin-top:10px}
.finyes{background:linear-gradient(180deg,#52D87A,#22A84B);color:#fff;box-shadow:0 5px 0 #167532}
.finno{background:#fff;color:#34425E;border:3px solid #B9C7DD!important;box-shadow:0 4px 0 #B9C7DD}
.rnd{width:48px;height:48px;border-radius:50%;border:2px solid var(--blue,#0D6EFD);background:#fff;font-size:22px;padding:0;flex:none;cursor:pointer}
.rnd.on{background:#DC2626;border-color:#DC2626;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.propcard{margin-top:10px;padding:10px 12px;border-radius:14px;background:#EEF6FF;border:2px solid #93C5FD;line-height:1.5}
.propcard b{display:block;color:#1D4ED8;margin-bottom:2px}
.propcard.del{background:#FEF2F2;border-color:#FCA5A5}.propcard.del b{color:#B91C1C}.propcard.del .pyes{background:#DC2626}
.propcard.ok{background:#F0FDF4;border-color:#86EFAC;color:#166534;font-weight:700}
.propcard.no{background:#F3F4F6;border-color:#D1D5DB;color:#6b7280}
.pbtns{display:flex;gap:8px;margin-top:8px}
.pbtns button{flex:1;border:0;border-radius:999px;height:42px;font:inherit;font-weight:800;cursor:pointer}
.pyes{background:#22A84B;color:#fff}.pno{background:#fff;color:#34425E;border:2px solid #B9C7DD!important}
.ainote{margin:10px 12px 0;padding:10px 14px;border-radius:14px;background:#FEF3C7;border:1px solid #FCD34D;color:#78350F;font-size:15px;font-weight:600;line-height:1.45;text-align:center}
.ttyping{text-align:center;font-size:30px;opacity:.7}
</style>
</head>
<body class="chatpage">
<div id="pick" class="aipick"></div>
<div class="aihint" id="hint"></div>
<main id="msgs"></main>
<form class="composer" id="form" autocomplete="off">
  <input id="text" type="text" placeholder="כתבו הודעה..." maxlength="500" enterkeyhint="send">
  <button class="cbtn send" id="send" type="submit" aria-label="שליחה"></button>
</form>
<script type="module">
import { initPage, supabase, esc, icon, showToast, submitReport, toIsraelDate, ilDate } from './js/common.js';
import { generateOccurrences, syncOccurrences } from './js/generate.js';
import { weeklyPoints, lifetimePoints } from './js/points.js';
import { gameSplash } from './js/gamesplash.js';
document.getElementById('send').innerHTML = icon('send', 22);
const { session, profiles, isAdmin } = await initPage({ active: 'ai', title: 'עוזרים', back: 'index.html' });
const meP = profiles.find(p => p.id === session.user.id);
const $ = id => document.getElementById(id);
const EN = (() => { try { return localStorage.getItem('lang') === 'en'; } catch (_) { return false; } })();
const myName = meP?.name || '';
const greetTime = () => { const h = new Date().getHours(), k = h >= 5 && h < 12 ? 0 : h >= 12 && h < 17 ? 1 : h >= 17 && h < 21 ? 2 : 3;
  return (EN ? ['Good morning', 'Good afternoon', 'Good evening', 'Good night'] : ['בוקר טוב', 'צהריים טובים', 'ערב טוב', 'לילה טוב'])[k]; };
const H = {
  chef: { ico: '👨‍🍳', name: 'השף', hint: 'שאלו את השף מה לבשל: ארוחות בוקר, צהריים, ערב וקינוחים', ph: 'מה בא לכם לבשל?',
    hi: () => `היי ${myName}, שמח שאתם כאן, מה בא לכם להכין היום?`,
    sug: ['🍳 ארוחת בוקר', '🥗 ארוחת צהריים', '🍝 ארוחת ערב', '🍰 קינוח מפנק', 'משהו אחר'], full: 'השף סיים להיום, נתראה מחר 👨‍🍳' },
  english: { ico: '🇬🇧', name: 'מורה לאנגלית', hint: 'תרגול אנגלית עם מורה סבלני. הוא שואל, מתקן ומסביר בעברית', ph: 'כתבו באנגלית או בעברית...',
    hi: () => `${greetTime()} ${myName}, מה בא לך לתרגל היום?`,
    sug: ['📚 מילים חדשות', '💬 שיחה באנגלית', '✏️ משפטים', '🎯 תרגיל מהיר', 'משהו אחר'], full: 'המורה סיים להיום, נתראה מחר 🇬🇧' },
};
H.home = { ico: '🏠', name: 'עוזר הבית', hint: 'שאלו אותי על המשימות, הדיווחים והנקודות, או איך להפעיל את האפליקציה. שינויים רק באישור שלכם', ph: 'שאלו אותי משהו...',
  hi: () => `היי ${myName}, מה תרצה לדעת על הבית?`,
  sug: ['מה לא בוצע היום?', 'מי עשה משימות אתמול?', 'כמה נקודות יש לכל אחד?', 'איך מוסיפים משימה?'], full: 'העוזר לא זמין כרגע' };
// עוזר הבית: רק לדובב (גם השרת חוסם כל אחד אחר)
if (!['e1fbc911-82d6-4eef-9989-21ca0324c906','67e6f7e0-9519-45cf-96ac-e2913ab95ce8'].includes(session.user.id)) delete H.home;
let cur = null, busy = false;
const noteHtml = () => `<div class="ainote">🔒 ${cur === 'english' && isAdmin ? 'השיחות נשלחות לבינה מלאכותית, ושיעורי אנגלית נשמרים לצפייה של ההורים' : 'השיחות נשלחות לבינה מלאכותית כדי לקבל תשובה'}</div>`;
const hdrBack = document.querySelector('header.bar a.iconbtn[href]');
const hist = { chef: [], english: [], home: [] };
try { const s = JSON.parse(sessionStorage.getItem('aiHist') || 'null'); if (s) { hist.chef = s.chef || []; hist.english = s.english || []; hist.home = s.home || []; } } catch (_) {}
const save = () => { try { sessionStorage.setItem('aiHist', JSON.stringify(hist)); } catch (_) {} };

function route() {
  const k = decodeURIComponent(location.hash.slice(1));
  cur = H[k] ? k : null;
  const chat = !!cur;
  const hh = document.querySelector('h1'); if (hh) hh.textContent = cur === 'english' ? 'שיעור אנגלית' : cur === 'chef' ? 'השף של הבית' : cur === 'home' ? 'עוזר הבית' : 'עוזרים';
  $('pick').classList.toggle('hidden', chat); $('msgs').classList.toggle('hidden', !chat);
  $('form').classList.toggle('hidden', !chat); $('hint').classList.toggle('hidden', !chat);
  if (!chat) {
    document.body.classList.remove('teacher');
    $('pick').innerHTML = Object.entries(H).map(([k2, h2]) => `<button type="button" data-k="${k2}"><span class="aipi">${h2.ico}</span><span class="aitt">${esc(h2.name)}</span><span class="aipd">${esc(h2.hint)}</span></button>`).join('');
    $('pick').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { location.hash = b.dataset.k; });
    return;
  }
  draw(); setupMic();
}
const SV = d => `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const T_ICONS = [
  SV('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5V21.5M9 8h7"/>'),
  SV('<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20.5l1.4-4.6A8 8 0 1 1 21 12zM8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/>'),
  SV('<path d="M4 20l1-5L16.5 3.5a2.1 2.1 0 0 1 3 3L8 18zM14 6l3 3"/>'),
  SV('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>')];
const SPK = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0A58CA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
// מתכון מלא: יש בו מצרכים ושלבי הכנה ממוספרים (לא רעיונות קצרים ולא שאלות)
const isRecipe = t => /(מצרכים|מרכיבים)/.test(t) && /^\s*[1-9][.)]\s/m.test(t);
function drawBoard() {
  const h = H[cur], list = hist[cur];
  const teacher = t => {
    const says = [...t.matchAll(/\[\[say:([^\]]{1,60})\]\]/g)].map(m => m[1].trim());
    let clean = t.replace(/\s*\[\[say:[^\]]*\]\]/g, '');
    const w = says[0];
    if (w) { const re = new RegExp('(^|[^A-Za-z])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])', 'i'); clean = clean.replace(re, '$1').replace(/[ \t]+\n/g, '\n').replace(/[:：]\s*$/m, ':').trim(); }
    return (clean ? `<div class="tchalk">${esc(clean)}</div>` : '') + (w ? `<div class="tword"><div class="w">${esc(w)}</div><div class="u"></div></div><button type="button" class="tsay" data-say="${esc(w)}" aria-label="הקשב למילה">${SPK} הקשב למילה</button>` : '');
  };
  const sug = list.length ? '' : `<div class="tbig">${h.sug.map((x, i) => `<button type="button" class="c${i + 1}" data-s="${esc(x)}">${T_ICONS[i] || ''}${esc(x.replace(/^[^\p{L}]+/u, ''))}</button>`).join('')}</div>`;
  $('msgs').innerHTML = `<div class="tboard${list.length ? ' run' : ''}"><div class="tin"><div class="ttitle"><div class="en">Let’s Learn English</div><div class="ln"></div></div><div class="tchalk">${esc(h.hi())}</div>`
    + list.map(m => m.role === 'user' ? `<div class="tnote">${esc(m.content)}</div>` : teacher(m.content)).join('')
    + (busy ? '<div class="ttyping">...</div>' : '') + `</div><div class="tledge"></div></div>` + sug + (list.length ? '' : noteHtml())
    + (list.filter(m => m.role === 'user').length >= 2 && !busy ? '<div style="margin:16px 0 4px"><button type="button" class="tfinish" id="finishBtn">🏁 סיימתי שיעור</button></div>' : '');
  const fb = $('finishBtn'); if (fb) fb.onclick = () => askFinish();
  $('msgs').querySelectorAll('[data-s]').forEach(b => b.onclick = () => send(b.dataset.s.replace(/^[^\p{L}]+/u, '')));
  $('msgs').querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  window.scrollTo(0, list.length ? document.body.scrollHeight : 0);
}
function draw() {
  document.body.classList.toggle('teacher', cur === 'english');
  if (cur === 'english') return drawBoard();
  const h = H[cur], list = hist[cur];
  $('hint').textContent = h.hint; $('text').placeholder = h.ph;
  const isDel = pr => pr && (pr.kind === 'remove_task' || pr.kind === 'remove_event');
  const propCard = (pr, i) => !pr ? '' : pr.state === 'done' ? '<div class="propcard ok">✅ בוצע</div>' : pr.state === 'no' ? '<div class="propcard no">בוטל</div>'
    : `<div class="propcard${isDel(pr) ? ' del' : ''}"><b>${pr.kind === 'remove_task' ? 'הסרת משימה' : pr.kind === 'remove_event' ? 'מחיקת אירוע מלוח השנה' : 'הצעה לשינוי'}</b><div>${esc(pr.summary)}</div><div class="pbtns"><button type="button" class="pyes" data-pa="${i}">${pr.kind === 'remove_task' ? 'הסר' : pr.kind === 'remove_event' ? 'מחק' : 'אישור'}</button><button type="button" class="pno" data-pc="${i}">ביטול</button></div></div>`;
  const bot = (t, share, pi = -1) => {
    const says = [...t.matchAll(/\[\[say:([^\]]{1,60})\]\]/g)].map(m => m[1].trim());
    const clean = t.replace(/\s*\[\[say:[^\]]*\]\]/g, '');
    return `<div class="msg bot"><div class="aiav">${h.ico}</div><div class="bubble">${cur === 'home' ? esc(clean).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*/g, '') : esc(clean)}${says.map(w => `<button type="button" class="saybtn" data-say="${esc(w)}" aria-label="הקשב למילה">🔊 הקשב למילה</button>`).join('')}${share ? `<button type="button" class="sharebtn" data-share="${esc(clean)}">💬 שתף את המתכון</button>` : ''}${pi >= 0 ? propCard(list[pi].prop, pi) : ''}</div></div>`; };
  $('msgs').innerHTML = (list.length ? '' : noteHtml()) + bot(h.hi()) + list.map((m, i) => m.role === 'user'
    ? `<div class="msg mine"><div class="bubble">${esc(m.content)}</div></div>` : bot(m.content, cur === 'chef' && isRecipe(m.content), m.prop ? i : -1)).join('')
    + (list.length ? '' : `<div class="aisug">${h.sug.map(s => `<button type="button" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`)
    + (busy ? `<div class="msg bot typing"><div class="aiav">${h.ico}</div><div class="bubble">...</div></div>` : '');
  $('msgs').querySelectorAll('[data-s]').forEach(b => b.onclick = () => send(b.dataset.s.replace(/^[^\p{L}]+/u, '')));
  $('msgs').querySelectorAll('[data-pa]').forEach(b => b.onclick = () => runProposal(+b.dataset.pa));
  $('msgs').querySelectorAll('[data-pc]').forEach(b => b.onclick = () => { const m = hist.home[+b.dataset.pc]; if (m?.prop) { m.prop.state = 'no'; save(); draw(); } });
  $('msgs').querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  $('msgs').querySelectorAll('[data-share]').forEach(b => b.onclick = () => { window.open('https://wa.me/?text=' + encodeURIComponent(b.dataset.share), '_blank', 'noopener'); });
  window.scrollTo(0, document.body.scrollHeight);
}
function say(w) {
  try {
    const sy = window.speechSynthesis; if (!sy) { showToast('ההקראה לא נתמכת במכשיר הזה', true); return; }
    sy.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = 0.85;
    const v = sy.getVoices().find(x => /^en[-_]US/i.test(x.lang)) || sy.getVoices().find(x => /^en/i.test(x.lang)); if (v) u.voice = v;
    sy.speak(u);
  } catch (_) { showToast('ההקראה לא הצליחה', true); }
}
function askFinish() {
  if (document.getElementById('finAsk')) return;
  const d = document.createElement('div'); d.id = 'finAsk'; d.className = 'finask';
  d.innerHTML = '<div class="finbox"><div class="finq">בטוח שאתה רוצה לסיים את השיעור?</div><button type="button" class="finyes">כן, לסיים</button><button type="button" class="finno">להמשיך בשיעור</button></div>';
  document.body.appendChild(d);
  d.querySelector('.finno').onclick = () => d.remove();
  d.querySelector('.finyes').onclick = () => { d.remove(); finishLesson(); };
}
async function finishLesson() {
  if (busy) return;
  const list = hist.english;
  if (list.filter(m => m.role === 'user').length < 2) return;
  busy = true; draw();
  let ok = false;
  try {
    const { data, error } = await supabase.functions.invoke('ai-helper', { body: { action: 'finish', helper: 'english', messages: list.slice(-200) } });
    ok = !error && !!data?.ok;
  } catch (_) {}
  busy = false;
  if (ok) { hist.english = []; save(); showToast('השיעור הסתיים. כל הכבוד! 👏'); }
  else showToast('לא הצלחנו לשלוח את השיעור, נסו שוב', true);
  draw();
}
// נקודות מחושבות באפליקציה (כמו במסך הראשי) לעוזר הבית. נשמר דקה כדי לא לחשב בכל הודעה.
let ptsCache = null;
async function homePoints() {
  if (ptsCache && Date.now() - ptsCache.t < 60000) return ptsCache.v;
  try { const [a, b] = await Promise.all([lifetimePoints(), weeklyPoints()]); ptsCache = { t: Date.now(), v: { total: a.earnedByUser, week: b.pointsByUser } }; return ptsCache.v; } catch (_) { return null; }
}
async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  const helper = cur;
  try { if (helper === 'english' && window.speechSynthesis) { const z = new SpeechSynthesisUtterance(' '); z.volume = 0; window.speechSynthesis.speak(z); } } catch (_) {} // פותח את ההקראה האוטומטית בטלפון
  hist[helper].push({ role: 'user', content: text }); save();
  $('text').value = ''; busy = true; draw();
  let reply = null, err = null, prop = null;
  try {
    const fn = helper === 'home' ? 'home-assistant' : 'ai-helper';
    const msgs = hist[helper].slice(helper === 'home' ? -30 : -80).map(({ role, content }) => ({ role, content }));
    const { data, error } = await supabase.functions.invoke(fn, { body: helper === 'home' ? { messages: msgs, points: await homePoints() } : { helper, messages: msgs } });
    if (error) { let c = null; try { c = (await error.context.json()).error; } catch (_) {} err = c || 'x'; }
    else { reply = data?.reply || null; prop = data?.proposal ? { ...data.proposal, state: 'open' } : null; }
  } catch (_) { err = 'x'; }
  busy = false;
  if (reply) { hist[helper].push({ role: 'assistant', content: reply, ...(prop ? { prop } : {}) }); save(); if (helper === 'home') speakReply(reply); const w = (reply.match(/\[\[say:([^\]]{1,60})\]\]/) || [])[1]; if (w && helper === 'english') setTimeout(() => say(w.trim()), 150);
    // המורה סיים 20 מילים ולא נתן מילה חדשה: השיעור מסתיים ונשלח להורים
    if (helper === 'english' && !w && hist.english.filter(m => m.role === 'assistant').reduce((n, m) => n + (m.content.match(/\[\[say:/g) || []).length, 0) >= 20) { draw(); await finishLesson(); return; } }
  else {
    hist[helper].pop(); save();
    showToast(err === 'helper_limit' || err === 'user_limit' ? H[helper].full : err === 'family_limit' ? 'הבית הגיע למגבלת השאלות להיום' : 'העוזר לא הצליח לענות, נסו שוב', true);
    $('text').value = text;
  }
  draw();
}
async function runProposal(i) {
  const m = hist.home[i]; const pr = m?.prop; if (!pr || pr.state !== 'open' || busy) return;
  busy = true; pr.state = 'work'; draw();
  let msg = '';
  try { msg = await execAction(pr); } catch (e) { msg = String(e.message || '').startsWith('ERR:') ? e.message : 'ERR:הפעולה נכשלה'; }
  busy = false;
  if (msg.startsWith('ERR:')) { pr.state = 'open'; save(); draw(); showToast(msg.slice(4), true); return; }
  pr.state = 'done'; hist.home.push({ role: 'assistant', content: msg }); save(); draw(); speakReply(msg);
}
async function execAction(pr) {
  const a = pr.args, uid = session.user.id;
  const need = async id => { const { data } = await supabase.from('tasks').select('*').eq('id', id).maybeSingle(); if (!data) throw new Error('ERR:לא מצאתי את המשימה'); return data; };
  if (pr.kind === 'mark_done') {
    const t = await need(a.task_id);
    if (t.kind !== 'occurrence' || !t.active) throw new Error('ERR:אי אפשר לדווח על המשימה הזאת מכאן');
    if (t.assignee_only && !((t.slots || []).flatMap(s => s.assignees || [s.assignee_id]).includes(uid))) throw new Error('ERR:המשימה הזאת שייכת למישהו אחר');
    const { count } = await supabase.from('feed').select('id', { count: 'exact', head: true }).eq('type', 'report').eq('task_id', t.id);
    if ((count || 0) >= (t.slots || []).length) throw new Error('ERR:המשימה הזאת כבר סומנה כבוצעה');
    if (t.requires_photo) throw new Error('ERR:המשימה דורשת תמונה, צריך לדווח עליה במסך המשימה');
    const { error } = await submitReport({ task: t, userId: uid, note: a.note });
    if (error) throw new Error('ERR:הדיווח נכשל');
    return `✅ סימנתי את "${t.title}" כבוצעה.`;
  }
  if (pr.kind === 'add_task') {
    const sin = a.slots || [{ assignee_id: a.assignee_id, time: a.time }];
    const ids = [...new Set(sin.map(x => x.assignee_id))];
    const { data: ppl } = await supabase.from('profiles').select('id,name,is_user,active').in('id', ids);
    const by = Object.fromEntries((ppl || []).map(x => [x.id, x]));
    if (ids.some(id => !by[id] || !by[id].is_user || !by[id].active)) throw new Error('ERR:לא מצאתי את האחראי');
    const repeat = a.repeat || 'once';
    const base = { title: a.title, description: a.description || null, tips: null, icon: 'sparkles', color: 'blue', subject_id: null, room: null,
      points: a.points || 0, penalty_points: 0, late_fraction: 0.5, requires_photo: !!a.requires_photo, assignee_only: false, times_required: sin.length,
      remind_before_minutes: 15, reminder_text: null, overdue_text: null, created_by: uid };
    const row = repeat === 'once'
      ? { ...base, kind: 'occurrence', template_id: null, repeat: 'once', weekday: null, occurrence_date: a.date,
          slots: sin.map((x, i) => ({ n: i + 1, assignee_id: x.assignee_id, due_at: toIsraelDate(a.date, x.time).toISOString(), reminded: false, overdue_notified: false, penalized: false })) }
      : { ...base, kind: 'template', repeat, weekday: repeat === 'weekly' ? a.weekday : null, slots: sin.map(x => ({ assignee_id: x.assignee_id, due_time: x.time })) };
    const { error } = await supabase.from('tasks').insert(row);
    if (error) throw new Error('ERR:היצירה נכשלה');
    if (row.kind === 'template') { try { await generateOccurrences(uid); } catch (_) {} }
    return `✅ הוספתי את המשימה "${a.title}" ל${ids.map(id => by[id].name).join(' ו')}.`;
  }
  if (pr.kind === 'edit_task') {
    const t = await need(a.task_id);
    if (!t.active) throw new Error('ERR:המשימה הזאת כבר הוסרה');
    const patch = {}; ['title', 'description', 'points', 'requires_photo'].forEach(k => { if (a[k] !== undefined) patch[k] = a[k]; });
    if (patch.points === 0) patch.penalty_points = 0;
    const { error } = await supabase.from('tasks').update(patch).eq('id', t.id);
    if (error) throw new Error('ERR:השינוי נכשל');
    if (t.kind === 'template') { try { await syncOccurrences({ ...t, ...patch }); } catch (_) {} }
    return `✅ עדכנתי את "${patch.title || t.title}".`;
  }
  if (pr.kind === 'remove_task') {
    const t = await need(a.task_id);
    if (!t.active) throw new Error('ERR:המשימה הזאת כבר הוסרה');
    const { error } = await supabase.from('tasks').update({ active: false }).eq('id', t.id);
    if (error) throw new Error('ERR:ההסרה נכשלה');
    if (t.kind === 'template') await supabase.from('tasks').update({ active: false }).eq('template_id', t.id).gte('occurrence_date', ilDate(new Date()));
    return `✅ הסרתי את "${t.title}". ההיסטוריה והנקודות נשמרו.`;
  }
  if (pr.kind === 'add_event' || pr.kind === 'edit_event' || pr.kind === 'remove_event') {
    const WD = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    const whoOf = async id => { const { data: w } = await supabase.from('profiles').select('id,name,is_user,active').eq('id', id).maybeSingle(); if (!w || !w.is_user || !w.active) throw new Error('ERR:לא מצאתי את בן הבית'); return w; };
    if (pr.kind === 'add_event') {
      const w = await whoOf(a.user_id);
      const row = { user_id: w.id, title: a.title, repeat: a.repeat, weekday: a.repeat === 'weekly' ? a.weekday : null, event_date: a.repeat === 'once' ? a.date : null, start_time: a.start, end_time: a.end };
      const { error } = await supabase.from('events').insert(row);
      if (error) throw new Error('ERR:ההוספה ללוח השנה נכשלה');
      return `✅ הוספתי ללוח השנה של ${w.name}: ${a.title}, ${a.repeat === 'weekly' ? 'כל יום ' + WD[a.weekday] : a.date.split('-').reverse().join('.')} ${a.start} עד ${a.end}.`;
    }
    const { data: ev } = await supabase.from('events').select('*').eq('id', a.event_id).maybeSingle();
    if (!ev) throw new Error('ERR:לא מצאתי את האירוע');
    if (pr.kind === 'remove_event') {
      const { error } = await supabase.from('events').delete().eq('id', ev.id);
      if (error) throw new Error('ERR:המחיקה נכשלה');
      return `✅ מחקתי מלוח השנה את "${ev.title}".`;
    }
    const patch = {};
    if (a.title) patch.title = a.title;
    if (a.user_id) patch.user_id = (await whoOf(a.user_id)).id;
    if (a.date) { if (ev.repeat !== 'once') throw new Error('ERR:האירוע הזה שבועי, אי אפשר לתת לו תאריך'); patch.event_date = a.date; }
    if (a.weekday !== undefined) { if (ev.repeat !== 'weekly') throw new Error('ERR:האירוע הזה חד-פעמי, אי אפשר לתת לו יום בשבוע'); patch.weekday = a.weekday; }
    if (a.start) patch.start_time = a.start;
    if (a.end) patch.end_time = a.end;
    const st = String(patch.start_time || ev.start_time).slice(0, 5), en = String(patch.end_time || ev.end_time).slice(0, 5);
    if (en <= st) throw new Error('ERR:שעת הסיום צריכה להיות אחרי שעת ההתחלה');
    const { error } = await supabase.from('events').update(patch).eq('id', ev.id);
    if (error) throw new Error('ERR:השינוי נכשל');
    return `✅ עדכנתי את "${patch.title || ev.title}" בלוח השנה.`;
  }
  if (pr.kind === 'change_slot') {
    const t = await need(a.task_id);
    if (!t.active) throw new Error('ERR:המשימה הזאת הוסרה');
    const slots = JSON.parse(JSON.stringify(t.slots || [])); const sl = slots[a.slot_n - 1];
    if (!sl) throw new Error('ERR:לא מצאתי את החזרה הזאת');
    let name = '';
    if (a.assignee_id) {
      const { data: who } = await supabase.from('profiles').select('id,name,is_user,active').eq('id', a.assignee_id).maybeSingle();
      if (!who || !who.is_user || !who.active) throw new Error('ERR:לא מצאתי את האחראי');
      sl.assignee_id = who.id; delete sl.assignees; name = who.name;
    }
    if (a.time) { if (t.kind === 'template') sl.due_time = a.time; else { sl.due_at = toIsraelDate(t.occurrence_date, a.time).toISOString(); sl.reminded = false; sl.overdue_notified = false; } }
    const { error } = await supabase.from('tasks').update({ slots }).eq('id', t.id);
    if (error) throw new Error('ERR:השינוי נכשל');
    if (t.kind === 'template') { try { await syncOccurrences({ ...t, slots }); } catch (_) {} }
    return `✅ עדכנתי את "${t.title}"${name ? ': האחראי עכשיו ' + name : ''}${a.time ? ', שעה ' + a.time : ''}.`;
  }
  throw new Error('ERR:פעולה לא מוכרת');
}
// מיקרופון והקראה (רק בעוזר הבית)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const speakOn = () => { try { return localStorage.getItem('homeSpeak') === '1'; } catch (_) { return false; } };
function speakReply(t) {
  if (!speakOn() || !window.speechSynthesis) return;
  try { const sy = window.speechSynthesis; sy.cancel(); const u = new SpeechSynthesisUtterance(String(t).replace(/[✅🏠]/g, '')); u.lang = 'he-IL'; sy.speak(u); } catch (_) {}
}
function setupMic() {
  const f = $('form'); ['mic', 'spk'].forEach(id => { const e = $(id); if (e && cur !== 'home') e.remove(); });
  if (cur !== 'home' || $('mic')) return;
  const mk = (id, txt, label) => { const b = document.createElement('button'); b.id = id; b.type = 'button'; b.className = 'cbtn rnd'; b.textContent = txt; b.setAttribute('aria-label', label); f.insertBefore(b, $('send')); return b; };
  const spk = mk('spk', speakOn() ? '🔊' : '🔈', 'הקראת תשובות');
  spk.onclick = () => { const on = !speakOn(); try { localStorage.setItem('homeSpeak', on ? '1' : '0'); } catch (_) {} spk.textContent = on ? '🔊' : '🔈'; if (!on) { try { window.speechSynthesis.cancel(); } catch (_) {} } showToast(on ? 'התשובות יוקראו' : 'ההקראה כבויה'); };
  if (!SR) return;
  const mic = mk('mic', '🎤', 'דיבור');
  let rec = null;
  mic.onclick = () => {
    if (rec) { try { rec.stop(); } catch (_) {} return; }
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}
    rec = new SR(); rec.lang = 'he-IL'; rec.interimResults = false; rec.maxAlternatives = 1;
    mic.classList.add('on');
    rec.onresult = e => { const t = e.results?.[0]?.[0]?.transcript || ''; if (t.trim()) send(t); };
    rec.onerror = e => { if (e.error !== 'aborted' && e.error !== 'no-speech') showToast('לא הצלחתי להשתמש במיקרופון', true); };
    rec.onend = () => { rec = null; mic.classList.remove('on'); };
    try { rec.start(); } catch (_) { rec = null; mic.classList.remove('on'); }
  };
}
