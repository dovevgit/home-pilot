<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | עוזרים</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.aipick{display:flex;flex-direction:column;gap:14px;padding:18px 14px}
.aipick button{border:3px solid var(--border,#ddd);background:#fff;border-radius:22px;padding:22px 14px;font:inherit;cursor:pointer;text-align:center;box-shadow:0 2px 8px rgba(31,41,55,.08)}
.aipick button:active{background:var(--bg)}
.aipick .aipi{font-size:54px;line-height:1}.aipick .aitt{display:block;font-size:24px;font-weight:800;margin-top:6px}.aipick .aipd{display:block;color:var(--muted,#667);font-size:16px;margin-top:4px}
.hidden{display:none!important}
.aihint{margin:8px 12px 0;color:var(--muted,#667);font-size:15px;text-align:center}
#msgs{padding:12px}
.msg.bot .bubble{background:#fff;white-space:pre-wrap}
.msg.mine .bubble{white-space:pre-wrap}
.aiav{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;box-shadow:0 2px 6px rgba(31,41,55,.08)}
.typing{opacity:.6}
.saybtn{display:flex;width:max-content;align-items:center;gap:6px;margin:8px 0 0;border:2px solid var(--blue,#0D6EFD);background:#fff;color:var(--blue-dark,#0A58CA);border-radius:999px;padding:6px 14px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;direction:ltr}
.aisug{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.aisug button{border:2px solid var(--blue,#0D6EFD);background:#fff;color:var(--blue-dark,#0A58CA);border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body class="chatpage">
<div id="pick" class="aipick"></div>
<div class="aihint" id="hint"></div>
<main id="msgs"></main>
<form class="composer" id="form" autocomplete="off">
  <input id="text" type="text" placeholder="כתבו הודעה..." maxlength="500" enterkeyhint="send">
  <button class="cbtn send" id="send" type="submit" aria-label="שליחה"></button>
</form>
<script type="module">
import { initPage, supabase, esc, icon, showToast } from './js/common.js';
import { gameSplash } from './js/gamesplash.js';
document.getElementById('send').innerHTML = icon('send', 22);
const OWNER_FAMILY = '40f12cb3-3fa9-4f99-a7fd-ad5a10e00b80';
const { session, profiles } = await initPage({ active: 'ai', title: 'עוזרים', back: 'index.html' });
const meP = profiles.find(p => p.id === session.user.id);
// תכונה ניסיונית: מוצגת רק בבית של הבעלים
if (meP?.family_id !== OWNER_FAMILY) { location.replace('index.html'); await new Promise(() => {}); }
const $ = id => document.getElementById(id);
const EN = (() => { try { return localStorage.getItem('lang') === 'en'; } catch (_) { return false; } })();
const myName = meP?.name || '';
const greetTime = () => { const h = new Date().getHours(), k = h >= 5 && h < 12 ? 0 : h >= 12 && h < 17 ? 1 : h >= 17 && h < 21 ? 2 : 3;
  return (EN ? ['Good morning', 'Good afternoon', 'Good evening', 'Good night'] : ['בוקר טוב', 'צהריים טובים', 'ערב טוב', 'לילה טוב'])[k]; };
const H = {
  chef: { ico: '👨‍🍳', name: 'השף', hint: 'שאלו את השף מה לבשל: ארוחות בוקר, צהריים, ערב וקינוחים', ph: 'מה בא לכם לבשל?',
    hi: () => `היי ${myName}, שמח שאתם כאן, מה בא לכם להכין היום?`,
    sug: ['🍳 ארוחת בוקר', '🥗 ארוחת צהריים', '🍝 ארוחת ערב', '🍰 קינוח מפנק', 'משהו אחר'], full: 'השף סיים להיום, נתראה מחר 👨‍🍳' },
  english: { ico: '🇬🇧', name: 'מורה לאנגלית', hint: 'תרגול אנגלית עם מורה סבלני. הוא שואל, מתקן ומסביר בעברית', ph: 'כתבו באנגלית או בעברית...',
    hi: () => `${greetTime()} ${myName}, מה בא לך לתרגל היום?`,
    sug: ['📚 מילים חדשות', '💬 שיחה באנגלית', '✏️ משפטים', '🎯 תרגיל מהיר', 'משהו אחר'], full: 'המורה סיים להיום, נתראה מחר 🇬🇧' },
};
let cur = null, busy = false;
const hdrBack = document.querySelector('header.bar a.iconbtn[href]');
const hist = { chef: [], english: [] };
try { const s = JSON.parse(sessionStorage.getItem('aiHist') || 'null'); if (s) { hist.chef = s.chef || []; hist.english = s.english || []; } } catch (_) {}
const save = () => { try { sessionStorage.setItem('aiHist', JSON.stringify(hist)); } catch (_) {} };

function route() {
  const k = decodeURIComponent(location.hash.slice(1));
  cur = H[k] ? k : null;
  const chat = !!cur;
  $('pick').classList.toggle('hidden', chat); $('msgs').classList.toggle('hidden', !chat);
  $('form').classList.toggle('hidden', !chat); $('hint').classList.toggle('hidden', !chat);
  if (!chat) {
    $('pick').innerHTML = Object.entries(H).map(([k2, h2]) => `<button type="button" data-k="${k2}"><span class="aipi">${h2.ico}</span><span class="aitt">${esc(h2.name)}</span><span class="aipd">${esc(h2.hint)}</span></button>`).join('');
    $('pick').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { location.hash = b.dataset.k; });
    return;
  }
  draw();
}
function draw() {
  const h = H[cur], list = hist[cur];
  $('hint').textContent = h.hint; $('text').placeholder = h.ph;
  const bot = t => {
    const says = [...t.matchAll(/\[\[say:([^\]]{1,60})\]\]/g)].map(m => m[1].trim());
    const clean = t.replace(/\s*\[\[say:[^\]]*\]\]/g, '');
    return `<div class="msg bot"><div class="aiav">${h.ico}</div><div class="bubble">${esc(clean)}${says.map(w => `<button type="button" class="saybtn" data-say="${esc(w)}" aria-label="הקשב למילה">🔊 הקשב למילה</button>`).join('')}</div></div>`; };
  $('msgs').innerHTML = bot(h.hi()) + list.map(m => m.role === 'user'
    ? `<div class="msg mine"><div class="bubble">${esc(m.content)}</div></div>` : bot(m.content)).join('')
    + (list.length ? '' : `<div class="aisug">${h.sug.map(s => `<button type="button" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`)
    + (busy ? `<div class="msg bot typing"><div class="aiav">${h.ico}</div><div class="bubble">...</div></div>` : '');
  $('msgs').querySelectorAll('[data-s]').forEach(b => b.onclick = () => send(b.dataset.s.replace(/^[^\p{L}]+/u, '')));
  $('msgs').querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  window.scrollTo(0, document.body.scrollHeight);
}
function say(w) {
  try {
    const sy = window.speechSynthesis; if (!sy) { showToast('ההקראה לא נתמכת במכשיר הזה', true); return; }
    sy.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = 0.85;
    const v = sy.getVoices().find(x => /^en[-_]US/i.test(x.lang)) || sy.getVoices().find(x => /^en/i.test(x.lang)); if (v) u.voice = v;
    sy.speak(u);
  } catch (_) { showToast('ההקראה לא הצליחה', true); }
}
async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  const helper = cur;
  try { if (helper === 'english' && window.speechSynthesis) { const z = new SpeechSynthesisUtterance(' '); z.volume = 0; window.speechSynthesis.speak(z); } } catch (_) {} // פותח את ההקראה האוטומטית בטלפון
  hist[helper].push({ role: 'user', content: text }); save();
  $('text').value = ''; busy = true; draw();
  let reply = null, err = null;
  try {
    const { data, error } = await supabase.functions.invoke('ai-helper', { body: { helper, messages: hist[helper].slice(-80) } });
    if (error) { let c = null; try { c = (await error.context.json()).error; } catch (_) {} err = c || 'x'; }
    else reply = data?.reply || null;
  } catch (_) { err = 'x'; }
  busy = false;
  if (reply) { hist[helper].push({ role: 'assistant', content: reply }); save(); const w = (reply.match(/\[\[say:([^\]]{1,60})\]\]/) || [])[1]; if (w && helper === 'english') setTimeout(() => say(w.trim()), 150); }
  else {
    hist[helper].pop(); save();
    showToast(err === 'helper_limit' || err === 'user_limit' ? H[helper].full : err === 'family_limit' ? 'הבית הגיע למגבלת השאלות להיום' : 'העוזר לא הצליח לענות, נסו שוב', true);
    $('text').value = text;
  }
  draw();
}
window.addEventListener('hashchange', route);
$('form').addEventListener('submit', e => { e.preventDefault(); send($('text').value); });
route();
// השף והמורה נפתחים עם מסך פתיחה של 4 שניות (לחיצה מדלגת)
if (cur === 'chef') gameSplash('chef-splash.jpg', 4000);
if (cur === 'english') gameSplash('teacher-splash.jpg', 4000);
</script>
</body>
</html>
