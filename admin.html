<script type="module">
import { initPage, supabase, esc, icon, iconBox, avatar, ilDate, ilTime, toIsraelDate, addDays, dow, CARD_COLORS, roomOptions, ART, slotUsers } from './js/common.js';
import { TASK_ICONS } from './js/icons.js';
import { findConflicts, loadEvents, availability, hm, normExc, suggestTimes } from './js/events.js';
import { generateOccurrences, syncOccurrences } from './js/generate.js';
import { callFamily, imageToDataUrl, captureFace } from './js/family.js';

const { session, me, profiles, isAdmin } = await initPage({ active: 'admin', title: 'ניהול משימות', back: 'index.html' });
const main = document.getElementById('main');
if (!isAdmin) {
  main.innerHTML = '<p class="empty">מסך זה זמין למנהל בלבד</p>';
  throw new Error('not admin');
}
const users = profiles.filter(p => p.is_user);
const WEEKDAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));

function toast(msg, err = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 3500);
}
const repeatLabel = t => {
  const n = t.times_required > 1 ? ` · ${t.times_required} פעמים` : '';
  return (t.repeat === 'daily' ? 'יומי' + (t.times_required > 1 ? ` · ${t.times_required} פעמים ביום` : '')
        : t.repeat === 'weekly' ? `שבועי · יום ${WEEKDAYS[t.weekday ?? 0]}` : 'חד-פעמי') ;
};

let view = 'list';
let editing = null;

/* ============ העדרויות: טעינה ובדיקות ============ */
const todayStr = ilDate(new Date());
const dm = d => d.split('-').reverse().slice(0, 2).join('.');
let absences = [];
async function loadAbsences() {
  const { data } = await supabase.from('absences').select('*').gte('end_date', todayStr).order('start_date');
  absences = data || [];
}
const absentOn = (uid, date) => absences.find(a => a.user_id === uid && a.start_date <= date && date <= a.end_date);
const tabsHtml = on => `<div class="tabs"><button id="tList" class="${on === 'list' ? 'on' : ''}">משימות</button><button id="tAdd" class="${on === 'form' ? 'on' : ''}">הוספה</button><button id="tAbs" class="${on === 'abs' ? 'on' : ''}">העדרויות</button><button id="tMem" class="${on === 'mem' ? 'on' : ''}">בני משפחה</button></div>`;
const wireTabs = () => {
  const l = document.getElementById('tList'), a = document.getElementById('tAdd'), b = document.getElementById('tAbs');
  if (l) l.onclick = showList; if (a) a.onclick = () => showForm(null); if (b) b.onclick = showAbsences;
  const m = document.getElementById('tMem'); if (m) m.onclick = showMembers;
};
// משימות שעדיין משויכות לנעדר בתקופת ההעדרות
async function affectedTasks(ab) {
  const { data } = await supabase.from('tasks').select('*').eq('active', true);
  const out = [];
  for (const t of data || []) {
    const mine = (t.slots || []).filter(sl => slotUsers(sl).includes(ab.user_id));
    if (!mine.length) continue;
    if (t.kind === 'occurrence') {
      if (mine.some(sl => { const d = sl.due_at ? ilDate(new Date(sl.due_at)) : t.occurrence_date; return d >= ab.start_date && d <= ab.end_date && d >= todayStr; })) out.push(t);
    } else if (t.kind === 'template') {
      let hit = false;
      for (let d = ab.start_date > todayStr ? ab.start_date : todayStr; d <= ab.end_date && !hit; d = addDays(d, 1)) hit = t.repeat === 'daily' || (t.repeat === 'weekly' && dow(d) === t.weekday);
      if (hit) out.push(t);
    }
  }
  return out;
}

/* ============ רשימה ============ */
/* ============ שינוי חד-פעמי ליום אחד של משימה יומית (בלי לגעת בהגדרה הקבועה) ============ */
async function openOnce(t) {
  await loadAbsences();
  const { data: occs } = await supabase.from('tasks').select('*').eq('template_id', t.id).eq('kind', 'occurrence').eq('active', true)
    .gte('occurrence_date', ilDate(new Date())).order('occurrence_date').limit(10);
  const list = occs || [];
  const m = document.createElement('div'); m.className = 'modal';
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  const dayLabel = d => d === todayStr ? 'היום' : d === addDays(todayStr, 1) ? 'מחר' : `יום ${WEEKDAYS[dow(d)]} ${dm(d)}`;
  const people = users.filter(u => u.active !== false);
  const draw = async (id) => {
    const o = list.find(x => x.id === id) || list[0];
    if (!o) { m.innerHTML = `<div class="modal-card"><button class="modal-x" id="ox" aria-label="סגירה">${icon('x', 20)}</button><h3 style="margin:0 0 8px" data-user>${esc(t.title)}</h3><p class="empty">אין עדיין משימות מוכנות לימים הקרובים</p></div>`; m.querySelector('#ox').onclick = close; return; }
    const { count } = await supabase.from('feed').select('id', { count: 'exact', head: true }).eq('task_id', o.id).eq('type', 'report');
    const done = count || 0;
    const slots = o.slots || [];
    const sel = slots.map(sl => [...slotUsers(sl)]);
    m.innerHTML = `<div class="modal-card"><button class="modal-x" id="ox" aria-label="סגירה">${icon('x', 20)}</button>
      <h3 style="margin:0 0 4px" data-user>${esc(t.title)}</h3>
      <small style="display:block;color:var(--muted);margin-bottom:10px">שינוי ליום אחד בלבד. ההגדרה הקבועה של המשימה לא משתנה, ולמחרת הכול חוזר כרגיל.</small>
      <label>איזה יום?</label>
      <select class="sel" id="oday">${list.map(x => `<option value="${x.id}" ${x.id === o.id ? 'selected' : ''}>${esc(dayLabel(x.occurrence_date))}</option>`).join('')}</select>
      ${slots.map((sl, i) => { const locked = i < done; const cur = sl.due_at ? ilTime(new Date(sl.due_at)) : '';
        return `<div style="margin-top:12px;padding-top:10px;border-top:2px solid var(--field)"><small style="display:block;margin-bottom:4px">${slots.length > 1 ? `חזרה ${i + 1}: ` : ''}<b data-user>${esc(slotUsers(sl).map(id => byId[id]?.name || '?').join(' + '))}</b> <span dir="ltr" style="display:inline-block">${esc(cur)}</span></small>
        <div class="avrow"><small>מי עושה ביום הזה (אפשר כמה):</small>${people.map(u => `<button type="button" class="avchip free ${sel[i].includes(u.id) ? 'on' : ''}" data-op="${i}" data-ou="${u.id}" ${locked ? 'disabled' : ''}><b data-user>${esc(u.name)}</b></button>`).join('')}</div>
        <div class="slotrow"><input type="time" data-ot="${i}" value="${cur}" dir="ltr" ${locked ? 'disabled' : ''}></div>${locked ? '<small style="color:#92400E">כבר דווח, אי אפשר לשנות</small>' : ''}</div>`; }).join('')}
      <div class="err" id="oerr" style="margin-top:8px"></div>
      <button class="btn" id="osave" style="margin-top:12px;width:100%">שמירה ליום הזה בלבד</button></div>`;
    m.querySelector('#ox').onclick = close;
    m.querySelector('#oday').onchange = e => draw(e.target.value);
    m.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { const i = +b.dataset.op, u = b.dataset.ou; sel[i] = sel[i].includes(u) ? sel[i].filter(x => x !== u) : [...sel[i], u]; b.classList.toggle('on', sel[i].includes(u)); });
    m.querySelector('#osave').onclick = async () => {
      const err = x => { m.querySelector('#oerr').textContent = x; };
      const next = slots.map((sl, i) => {
        if (i < done) return sl;
        const tm = m.querySelector(`[data-ot="${i}"]`).value, grp = sel[i], who = grp[0];
        if (!tm || !who) return null;
        const due = toIsraelDate(o.occurrence_date, tm).toISOString();
        const { assignees: _a, ...rest } = sl;
        const changed = due !== sl.due_at || grp.join() !== slotUsers(sl).join();
        return { ...rest, ...(grp.length > 1 ? { assignees: grp } : {}), assignee_id: who, due_at: due, ...(changed ? { reminded: false, overdue_notified: false, penalized: false } : {}) };
      });
      if (next.some(x => !x)) return err('צריך לבחור מי עושה ולהזין שעה בכל שורה');
      if (next.some((x, i) => i >= done && x.due_at !== slots[i].due_at && new Date(x.due_at) < new Date())) return err('השעה כבר עברה');
      const ab = next.flatMap(x => slotUsers(x)).map(id => absentOn(id, o.occurrence_date) && byId[id]?.name).find(Boolean);
      if (ab && !confirm(`${ab} רשום/ה כנעדר/ת ביום הזה. לשמור בכל זאת?`)) return;
      if (done === 0) next.sort((a, b) => a.due_at.localeCompare(b.due_at));
      next.forEach((x, i) => { x.n = i + 1; });
      m.querySelector('#osave').disabled = true;
      const { error } = await supabase.from('tasks').update({ slots: next }).eq('id', o.id);
      if (error) { m.querySelector('#osave').disabled = false; return err('השמירה נכשלה'); }
      o.slots = next;
      toast('נשמר ליום הזה בלבד'); close();
    };
  };
  document.body.append(m);
  await draw();
}

async function showList() {
  view = 'list'; editing = null;
  main.innerHTML = `
    ${tabsHtml('list')}
    <div class="filters">
      <select id="fMember"><option value="">כל המשפחה</option>${users.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
      <select id="fRepeat"><option value="">יומי ושבועי</option><option value="daily">יומי</option><option value="weekly">שבועי</option><option value="once">חד-פעמי</option></select>
    </div>
    <div id="rows"><p class="empty">טוען...</p></div>
    <button class="btn secondary" id="delAllTasks" type="button" style="width:100%;margin-top:8px;color:#B91C1C;border-color:#EF4444">מחיקת כל המשימות (איפוס)</button>
    <p class="note">מסיר את כל המשימות והגדרות המשימות כדי להתחיל מחדש. ההיסטוריה והנקודות נשמרות.</p>
    <div class="sec-title" style="margin-top:22px">הצ'אט המשפחתי</div>
    <button class="btn secondary" id="wipe" type="button" style="width:100%;margin-top:0;color:#B91C1C;border-color:#EF4444">מחיקת כל הודעות הצ'אט</button>
    <p class="note">מוחק את הודעות הצ'אט ואת הודעות המערכת (כולל התמונות שנשלחו בצ'אט). דיווחי המשימות והנקודות לא נמחקים.</p>
    <div class="sec-title" style="margin-top:22px">הודעה מיוחדת בדף הבית</div>
    <textarea id="annTxt" maxlength="200" placeholder="למשל: מי שיקבל הכי הרבה נקודות השבוע יזכה בפרס: חטיף לבחירתו"></textarea>
    <div style="display:flex;gap:10px"><button class="btn" id="annSave" type="button" style="margin-top:8px;flex:1">פרסום ההודעה</button><button class="btn secondary" id="annClear" type="button" style="margin-top:8px;flex:1">הסרת ההודעה</button></div>
    <p class="note">ההודעה מופיעה לכולם בראש דף הבית עם גביע. רק מנהלים יכולים לשנות אותה.</p>
    <div class="sec-title" style="margin-top:22px">בקשות מיוחדות</div>
    <label for="reqPts" style="margin-top:0">כמה נקודות מקבל מי שמבצע בקשה</label>
    <div style="display:flex;gap:10px;align-items:center"><input type="number" id="reqPts" min="0" max="100" style="flex:1" dir="ltr"><button class="btn" id="reqSave" type="button" style="margin-top:0;width:auto;padding:0 24px">שמירה</button></div>
    <p class="note">הסכום נקבע בזמן שליחת הבקשה, ושינוי כאן משפיע רק על בקשות חדשות.</p>
    <div id="bCard" style="display:none">
    <div class="sec-title" style="margin-top:22px">נקודות בונוס</div>
    <select class="sel" id="bUser" style="width:100%"><option value="">למי לתת?</option>${users.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
    <input type="number" id="bPts" min="1" max="1000" inputmode="numeric" dir="ltr" placeholder="כמה נקודות" style="margin-top:8px">
    <input id="bReason" maxlength="200" placeholder="הסיבה, למשל: עזרת מעבר למה שנדרש" style="margin-top:8px">
    <button class="btn" id="bSend" type="button" style="margin-top:8px">שליחת בונוס</button>
    <p class="note">המקבל/ת רואה חלונית עם הסיבה, ומקבל/ת התראה לטלפון. הנקודות נכנסות לנקודות השבועיות ולחנות.</p>
    <div id="bList"></div>
    </div>
    <div class="sec-title" style="margin-top:22px">היסטוריית דיווחים</div>
    <button class="btn secondary" id="wipeRep" type="button" style="width:100%;margin-top:0;color:#B91C1C;border-color:#EF4444">מחיקת כל הדיווחים וההיסטוריה</button>
    <p class="note">מוחק את כל דיווחי המשימות (כולל תמונות הדיווח) ומאפס את הנקודות. אי אפשר לשחזר. מתאים לניקוי אחרי בדיקות. אפשר גם למחוק דיווח בודד: במסך ההיסטוריה לוחצים על דיווח.</p>`;
  wireTabs();
  document.getElementById('delAllTasks').onclick = async (e) => {
    if (!confirm('למחוק את כל המשימות והגדרות המשימות?\nההיסטוריה והנקודות נשמרות.')) return;
    if (!confirm('בטוח? אחרי המחיקה צריך להגדיר משימות מחדש.')) return;
    e.target.disabled = true;
    const { error: e1 } = await supabase.from('tasks').update({ active: false }).eq('active', true);
    if (e1) { toast('המחיקה נכשלה: ' + e1.message, true); e.target.disabled = false; return; }
    try { const { data: cs } = await supabase.from('task_conflicts').select('id').eq('status', 'open'); for (const c of cs || []) await supabase.rpc('conflict_dismiss', { p_id: c.id }); } catch (_) {}
    toast('כל המשימות הוסרו'); showList();
  };
  (async () => {
    const { data: st } = await supabase.from('app_settings').select('value').eq('key', 'request_points').maybeSingle();
    document.getElementById('reqPts').value = st?.value ?? 5;
  })();
  (async () => {
    const { data: an } = await supabase.from('app_settings').select('value').eq('key', 'announcement').maybeSingle();
    document.getElementById('annTxt').value = an?.value || '';
  })();
  const saveAnn = async (v, msg) => {
    const { error } = await supabase.from('app_settings').upsert({ key: 'announcement', value: v });
    toast(error ? 'השמירה נכשלה: ' + error.message : msg, !!error);
  };
  document.getElementById('annSave').onclick = () => saveAnn(document.getElementById('annTxt').value.trim(), 'ההודעה פורסמה');
  document.getElementById('annClear').onclick = () => { document.getElementById('annTxt').value = ''; saveAnn('', 'ההודעה הוסרה'); };
  document.getElementById('reqSave').onclick = async () => {
    const v = parseInt(document.getElementById('reqPts').value);
    if (Number.isNaN(v) || v < 0) return toast('צריך להזין מספר נקודות', true);
    const { error } = await supabase.from('app_settings').upsert({ key: 'request_points', value: String(v) });
    toast(error ? 'השמירה נכשלה: ' + error.message : 'נשמר', !!error);
  };
  const loadBonus = async () => {
    const { data } = await supabase.from('bonus_points').select('id,user_id,points,reason,created_at').order('created_at', { ascending: false }).limit(5);
    document.getElementById('bList').innerHTML = (data || []).length ? '<div class="note" style="text-align:start;margin-top:10px"><b>בונוסים אחרונים</b></div>' + data.map(b => `<div class="row-item" style="align-items:center">${avatar(byId[b.user_id], 36)}<div style="flex:1;min-width:0"><b>${esc(byId[b.user_id]?.name || '')}</b> <span dir="ltr">+${b.points}</span><div class="note" style="text-align:start;margin:0">${esc(b.reason)}</div></div><button class="btn secondary bdel" data-id="${b.id}" type="button" style="width:auto;margin:0;padding:0 14px">מחיקה</button></div>`).join('') : '';
    document.querySelectorAll('.bdel').forEach(x => x.onclick = async () => {
      if (!confirm('למחוק את הבונוס? הנקודות יורדו.')) return;
      const { error } = await supabase.from('bonus_points').delete().eq('id', x.dataset.id);
      toast(error ? 'המחיקה נכשלה: ' + error.message : 'נמחק', !!error); loadBonus();
    });
  };
  supabase.rpc('is_bonus_giver').then(({ data }) => { if (data === true) { document.getElementById('bCard').style.display = ''; loadBonus(); } });
  document.getElementById('bSend').onclick = async (e) => {
    const uid = document.getElementById('bUser').value, pts = parseInt(document.getElementById('bPts').value), reason = document.getElementById('bReason').value.trim();
    if (!uid) return toast('צריך לבחור למי לתת', true);
    if (!(pts >= 1 && pts <= 1000)) return toast('צריך מספר נקודות בין 1 ל-1000', true);
    if (!reason) return toast('צריך לכתוב סיבה', true);
    e.target.disabled = true;
    const { error } = await supabase.from('bonus_points').insert({ user_id: uid, points: pts, reason, given_by: session.user.id });
    e.target.disabled = false;
    if (error) return toast('השליחה נכשלה: ' + error.message, true);
    toast(`נשלח: ${byId[uid]?.name || ''} קיבל/ה ${pts} נקודות`);
    document.getElementById('bPts').value = ''; document.getElementById('bReason').value = ''; document.getElementById('bUser').value = '';
    loadBonus();
  };
  document.getElementById('wipeRep').onclick = async (e) => {
    if (!confirm('למחוק את כל הדיווחים וההיסטוריה? הנקודות יתאפסו (כולל יתרות החנות) ואי אפשר לשחזר.')) return;
    e.target.disabled = true;
    try {
      const { data: reps } = await supabase.from('feed').select('id,photo_path').eq('type', 'report');
      const photos = (reps || []).map(m => m.photo_path).filter(Boolean);
      const { error: dErr } = await supabase.from('feed').delete().eq('type', 'report');
      if (dErr) throw dErr;
      if (photos.length) await supabase.storage.from('photos').remove(photos);
      toast(`ההיסטוריה נמחקה (${(reps || []).length} דיווחים)`);
    } catch (err) { toast('המחיקה נכשלה: ' + (err.message || err), true); }
    e.target.disabled = false;
  };
  document.getElementById('wipe').onclick = async (e) => {
    if (!confirm('למחוק את כל הודעות הצ\'אט? אי אפשר לשחזר.')) return;
    e.target.disabled = true;
    try {
      const { data: msgs } = await supabase.from('feed').select('id,photo_path').in('type', ['chat', 'system']);
      const photos = (msgs || []).map(m => m.photo_path).filter(Boolean);
      const { error: dErr } = await supabase.from('feed').delete().in('type', ['chat', 'system']);
      if (dErr) throw dErr;
      if (photos.length) await supabase.storage.from('photos').remove(photos);
      toast(`הצ'אט נמחק (${(msgs || []).length} הודעות)`);
    } catch (err) { toast('המחיקה נכשלה: ' + (err.message || err), true); }
    e.target.disabled = false;
  };
  const { data, error } = await supabase.from('tasks').select('*').eq('active', true)
    .or('kind.eq.template,and(kind.eq.occurrence,template_id.is.null)').order('created_at', { ascending: false });
  const el = document.getElementById('rows');
  if (error) { el.innerHTML = '<p class="empty">לא הצלחנו לטעון</p>'; return; }
  const SH = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const slotsLine = t => {
    const parts = (t.slots || []).map(sl => {
      const nm = slotUsers(sl).map(id => byId[id]?.name || '?').join(' + '), tm = sl.due_time || (sl.due_at ? ilTime(new Date(sl.due_at)) : '');
      const ex = Object.entries(sl.exc || {}).map(([wd, v]) => `${SH[wd]}: ${byId[(typeof v === 'string' ? v : v?.u)]?.name || '?'}${v && v.t ? ' ' + v.t : ''}`).join(', ');

      }

  // שעה שונה ביום מסוים בשבוע (משימה יומית): נשמר ב-exc כ-{u, t}. לא תלוי בפעילות בלוח השנה.

  $('times').oninput = drawSlots; $('room').onchange = drawSlots; $('date').onchange = drawSlots; $('weekday').onchange = drawSlots; $('repeat').onchange = () => { toggle(); drawSlots(); }; toggle(); drawSlots();

    try {
      const conflicts = await findConflicts({ repeat, weekday: parseInt($('weekday').value), date: $('date').value, slots: slots.flatMap(s => [s, ...(s.with || []).map(u => ({ ...s, assignee_id: u }))]) }, profiles);
      if (conflicts.length && !confirm('שים לב להתנגשות עם לוח השנה:\n\n' + conflicts.join('\n') + '\n\nלשמור את המשימה בכל זאת?')) { toast('השמירה בוטלה. המשימה לא נשמרה'); return; }
    } catch (_) {}
    const typeChanged = isTpl && repeat !== t.repeat;
    if (typeChanged && !confirm(`לשנות את המשימה ל${repeat === 'weekly' ? 'שבועית' : 'יומית'}?\n\nמשימות עתידיות שעוד לא דווחו יימחקו ויווצרו מחדש לפי הסוג החדש. דיווחים והיסטוריה לא יימחקו.`)) { toast('השמירה בוטלה. המשימה לא נשמרה'); return; }
    const btn = $('save'); btn.disabled = true; btn.textContent = 'שומר...';
    const res = t ? await supabase.from('tasks').update(row).eq('id', t.id)
                  : await supabase.from('tasks').insert({ ...row, created_by: session.user.id });
    if (res.error) { btn.disabled = false; btn.textContent = 'שמירת משימה'; return err('השמירה נכשלה: ' + res.error.message); }
    if (typeChanged) {
      try {
        const { data: occ } = await supabase.from('tasks').select('id').eq('template_id', t.id).gte('occurrence_date', ilDate(new Date()));
        for (const o of occ || []) {
          const { count } = await supabase.from('feed').select('id', { count: 'exact', head: true }).eq('type', 'report').eq('task_id', o.id);
          if (!count) await supabase.from('tasks').delete().eq('id', o.id);
        }
      } catch (_) {}
    }
    if (t && row.kind === 'template') { try { await syncOccurrences({ ...row, id: t.id }); } catch (_) {} }
    if (row.kind === 'template') { try { await generateOccurrences(session.user.id); } catch (_) {} }
    if (t) { toast('המשימה נשמרה'); showList(); }
    else { toast('המשימה נשמרה. אפשר להוסיף עוד אחת'); showForm(null); window.scrollTo(0, 0); }
  };
}


/* ============ בני משפחה ============ */
async function showMembers() {
  view = 'mem';
  const { data: fam } = await supabase.from('families').select('name,code').maybeSingle();
  const list = profiles.filter(p => p.active !== false);
  main.innerHTML = `${tabsHtml('mem')}
    <div class="card flat" style="text-align:center">
      <div class="sec-title" style="margin:0">קוד הבית שלכם</div>
      <div style="font-size:34px;font-weight:800;letter-spacing:4px;margin:6px 0" dir="ltr">${esc(fam?.code || '')}</div>
      <p class="note" style="margin:0">כל בן משפחה נכנס עם קוד הבית, שם המשתמש והסיסמה שלו.</p>
    </div>
    <div class="sec-title">בני המשפחה</div>
    <div id="memRows">${list.map(p => `<div class="row-item">${avatar(p, 44)}
      <div class="tmain"><b>${esc(p.name)}${p.role === 'admin' ? ' · הורה' : ''}</b><small>${p.is_user ? 'שם משתמש: ' + esc(p.username || '') : 'דמות (ללא כניסה)'}</small></div>
      <button class="sqbtn edit" data-ph="${p.id}" aria-label="תמונה" title="תמונה">${icon('camera', 20)}</button>
      ${p.is_user ? `<button class="sqbtn edit" data-pw="${p.id}" aria-label="איפוס סיסמה" title="איפוס סיסמה">${icon('settings', 20)}</button>` : ''}
      ${p.id === me.id ? '' : `<button class="sqbtn del" data-rm="${p.id}" aria-label="הסרה">${icon('trash-2', 20)}</button>`}</div>`).join('')}</div>
    <input type="file" id="phFile" accept="image/*" style="display:none"><input type="file" id="phCam" accept="image/*" capture="user" style="display:none">
    <div id="phSheet" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center"><div style="background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px;display:grid;gap:10px"><b style="text-align:center">תמונה לבן/בת המשפחה</b><button class="btn" id="phShoot" type="button" style="margin:0">צילום עכשיו</button><button class="btn secondary" id="phPick" type="button" style="margin:0">בחירה מהגלריה</button><button class="btn secondary" id="phCancel" type="button" style="margin:0">ביטול</button></div></div>
    <form class="card flat" id="mf" novalidate style="margin-top:12px">
      <div class="sec-title" style="margin-top:0">הוספת בן משפחה</div>
      <label for="mName">שם</label><input id="mName" maxlength="20" placeholder="למשל: דנה">
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="mChar" style="width:auto"> דמות בלי כניסה (למשל חיית מחמד)</label>
      <div id="mLogin">
        <label for="mUser">שם משתמש</label><input id="mUser" dir="ltr" maxlength="20" autocapitalize="none" placeholder="אותיות או ספרות">
        <label for="mPass">סיסמה (לפחות 6 תווים)</label><input id="mPass" dir="ltr" maxlength="72" placeholder="סיסמה זמנית">
        <label for="mRole">תפקיד</label><select class="sel" id="mRole" style="width:100%"><option value="member">ילד/ה</option><option value="admin">הורה</option></select>
      </div>
      <label for="mPhoto">תמונה (אפשר לצלם או לבחור מהגלריה)</label><input id="mPhoto" type="file" accept="image/*"><input id="mCam" type="file" accept="image/*" capture="user" style="display:none"><button class="btn secondary" id="mShoot" type="button" style="margin-top:8px">צילום עכשיו</button><small id="mCamName" style="display:block;margin-top:4px"></small>
      <p class="error" id="mErr" role="alert"></p>
      <button class="btn" id="mSave" type="submit">הוספה</button>
    </form>
    <div class="sec-title" style="margin-top:22px">מחיקת הבית</div>
    <button class="btn secondary" id="famDel" type="button" style="width:100%;margin-top:0;color:#B91C1C;border-color:#EF4444">מחיקת הבית וכל הנתונים</button>
    <p class="note">מוחק לצמיתות את כל המשימות, התמונות, ההודעות והנקודות של הבית. אי אפשר לשחזר.</p>`;
  wireTabs();
  const $ = id => document.getElementById(id), done = (msg) => { toast(msg); location.hash = '#members'; location.reload(); };
  $('mChar').onchange = () => { $('mLogin').style.display = $('mChar').checked ? 'none' : ''; };
  let phFor = null;
  document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { phFor = b.dataset.ph; $('phSheet').style.display = 'flex'; });
  $('phCancel').onclick = () => { $('phSheet').style.display = 'none'; };
  $('phShoot').onclick = async () => {
    $('phSheet').style.display = 'none';
    const r = await captureFace();
    if (r === 'unsupported') { $('phCam').click(); return; }
    if (!r || !phFor) return;
    try { await callFamily('member_update', { id: phFor, avatar: r }); done('התמונה עודכנה'); } catch (e) { toast(e.message, true); }
  };
  $('phPick').onclick = () => { $('phSheet').style.display = 'none'; $('phFile').click(); };
  let camData = null;
  $('mShoot').onclick = async () => {
    const r = await captureFace();
    if (r === 'unsupported') { $('mCam').click(); return; }
    if (r) { camData = r; $('mCamName').textContent = 'צולמה תמונה ✓'; }
  };
  $('mCam').onchange = () => { $('mCamName').textContent = $('mCam').files[0] ? 'צולמה תמונה ✓' : ''; };
  $('phCam').onchange = $('phFile').onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f || !phFor) return;
    try { await callFamily('member_update', { id: phFor, avatar: await imageToDataUrl(f) }); done('התמונה עודכנה'); } catch (e) { toast(e.message, true); }
  };
  document.querySelectorAll('[data-pw]').forEach(b => b.onclick = async () => {
    const pw = prompt('סיסמה חדשה (לפחות 6 תווים):'); if (!pw) return;
    try { await callFamily('member_update', { id: b.dataset.pw, password: pw }); toast('הסיסמה שונתה'); } catch (e) { toast(e.message, true); }
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const p = byId[b.dataset.rm];
    if (!confirm(`להסיר את ${p?.name}? ההיסטוריה נשמרת, אבל אי אפשר יהיה להיכנס.`)) return;
    try { await callFamily('member_remove', { id: b.dataset.rm }); done('הוסר/ה'); } catch (e) { toast(e.message, true); }
  });
  $('mf').onsubmit = async (e) => {
    e.preventDefault(); $('mErr').textContent = '';
    const body = { name: $('mName').value, is_user: !$('mChar').checked, username: $('mUser').value, password: $('mPass').value, role: $('mRole').value };
    try {
      const mf0 = $('mCam').files[0] || $('mPhoto').files[0];
      if (camData) body.avatar = camData; else if (mf0) body.avatar = await imageToDataUrl(mf0);
      $('mSave').disabled = true;
      await callFamily('member_create', body); done('נוסף/ה');
    } catch (err) { $('mErr').textContent = err.message; $('mSave').disabled = false; }
  };
  $('famDel').onclick = async () => {
    const c = prompt(`מוחק את כל הבית לצמיתות. להמשך, הקלידו את קוד הבית (${fam?.code}):`); if (!c) return;
    if (!confirm('בטוחים? כל הנתונים יימחקו ואי אפשר לשחזר.')) return;
    try { await callFamily('family_delete', { confirm: c }); await supabase.auth.signOut(); location.replace('login.html'); } catch (e) { toast(e.message, true); }
  };
}

/* ============ העדרויות ============ */
async function showAbsences(editAb) {
  view = 'abs';
  await loadAbsences();
  const a = editAb && editAb.id ? editAb : { user_id: users[0]?.id, start_date: todayStr, end_date: todayStr, reason: '' };
  main.innerHTML = `${tabsHtml('abs')}
    <div class="sec-title" style="margin-top:0">העדרויות פעילות ועתידיות</div>
    <div id="absRows">${absences.length ? absences.map(x => `<div class="row-item">${avatar(byId[x.user_id], 44)}
      <div class="tmain"><b>${esc(byId[x.user_id]?.name || '')} · ${esc(x.reason)}</b><small>${x.start_date === x.end_date ? dm(x.start_date) : `${dm(x.start_date)} עד ${dm(x.end_date)}`}${x.start_date <= todayStr ? ' · כעת' : ''}</small></div>
      <button class="sqbtn edit" data-e="${x.id}" aria-label="עריכה">${icon('pencil', 20)}</button>
      <button class="sqbtn del" data-d="${x.id}" aria-label="מחיקה">${icon('trash-2', 20)}</button></div>`).join('') : '<p class="empty">אין העדרויות</p>'}</div>
    <form class="card flat" id="af" novalidate style="margin-top:12px">
      <div class="sec-title" style="margin-top:0">${a.id ? 'עריכת העדרות' : 'העדרות חדשה'}</div>
      <label for="aUser">מי נעדר/ת</label>
      <select class="sel" id="aUser" style="width:100%">${users.map(u => `<option value="${u.id}" ${a.user_id === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
      <div class="grid2"><div><label for="aFrom">מתאריך</label><input id="aFrom" type="date" value="${a.start_date}" dir="ltr"></div>
      <div><label for="aTo">עד תאריך (כולל)</label><input id="aTo" type="date" value="${a.end_date}" dir="ltr"></div></div>
      <label for="aReason">סיבה</label>
      <input id="aReason" maxlength="80" list="aReasons" value="${esc(a.reason)}" placeholder="למשל: חולה, טיול, אצל סבתא">
      <datalist id="aReasons"><option value="חולה"><option value="טיול"><option value="אצל סבתא"><option value="נסיעה"><option value="מחנה"></datalist>
      <p class="error" id="aErr" role="alert"></p>
      <button class="btn" id="aSave" type="submit">שמירה</button>
      ${a.id ? '<button class="btn secondary" id="aCancel" type="button">ביטול עריכה</button>' : ''}
    </form>
    <p class="note">בזמן העדרות אי אפשר לשייך לאדם משימות. אם כבר יש לו משימות בתקופה, תוצג רשימה כדי שתשנו אחראי.</p>`;
  wireTabs();
  if (a.id) document.getElementById('aCancel').onclick = () => showAbsences();
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { showAbsences(absences.find(x => x.id === b.dataset.e)); window.scrollTo(0, document.body.scrollHeight); });
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    if (!confirm('למחוק את ההעדרות?')) return;
    const { error } = await supabase.from('absences').delete().eq('id', b.dataset.d);
    toast(error ? 'המחיקה נכשלה' : 'ההעדרות נמחקה', !!error); showAbsences();
  });
  document.getElementById('af').onsubmit = async (e) => {
    e.preventDefault();
    const err = m => { document.getElementById('aErr').textContent = m; return false; };
    const row = { user_id: document.getElementById('aUser').value, start_date: document.getElementById('aFrom').value, end_date: document.getElementById('aTo').value, reason: document.getElementById('aReason').value.trim() };
    if (!row.start_date || !row.end_date) return err('צריך לבחור תאריכים');
    if (row.end_date < row.start_date) return err('תאריך הסיום לפני תאריך ההתחלה');
    if (!row.reason) return err('צריך להזין סיבה');
    const btn = document.getElementById('aSave'); btn.disabled = true;
    const res = a.id ? await supabase.from('absences').update(row).eq('id', a.id) : await supabase.from('absences').insert(row);
    if (res.error) { btn.disabled = false; return err('השמירה נכשלה: ' + res.error.message); }
    toast('ההעדרות נשמרה');
    let aff = []; try { aff = await affectedTasks(row); } catch (ex) { console.error("affected", ex); }
    await showAbsences();
    if (aff.length) showAffected(row, aff);
  };
}
function showAffected(ab, list) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="modal-card"><button type="button" class="modal-x" aria-label="סגירה">${icon('x', 20)}</button>
    <h2 style="margin:0 0 6px">יש משימות שצריך להעביר</h2>
    <p class="note" style="text-align:start">ל${esc(byId[ab.user_id]?.name || '')} יש עדיין משימות בתקופת ההעדרות. לחצו על משימה כדי לשנות את האחראי.</p>
    ${list.map(t => `<div class="row-item">${iconBox(t, 40)}<div class="tmain"><b data-user>${esc(t.title)}</b><small>${esc(repeatLabel(t))}${t.kind === 'occurrence' && t.template_id ? ' · של היום/השבוע' : ''}</small></div>
      <button class="sqbtn edit" data-t="${t.id}" aria-label="עריכה">${icon('pencil', 20)}</button></div>`).join('')}</div>`;
  document.body.append(m);
  m.querySelector('.modal-x').onclick = () => m.remove();
  m.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
    let t = list.find(x => x.id === b.dataset.t);
    // משימה שנוצרה מתבנית: עורכים את התבנית (היא תעדכן את המשימות של היום והשבוע)
    if (t.kind === 'occurrence' && t.template_id) { const { data } = await supabase.from('tasks').select('*').eq('id', t.template_id).maybeSingle(); if (data) t = data; }
    m.remove(); showForm(t);
  });
}

await loadAbsences();
if (location.hash === '#members') showMembers(); else showList();
document.addEventListener('click', e => { const b = e.target.closest('.icob'); if (!b) return; const h = document.getElementById('icon'); if (!h) return; h.value = b.dataset.ic; document.querySelectorAll('.icob').forEach(x => { const on = x === b; x.style.borderColor = on ? '#F97316' : 'var(--field)'; x.style.background = on ? '#FFE7CC' : '#fff'; }); });
</script>
