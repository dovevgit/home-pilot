<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | משימות בונוס</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.bn-hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;padding-inline-end:128px;margin-bottom:16px;color:#4A2A00;background:radial-gradient(circle at 18% 30%,#FFE27A 0,#FFC233 38%,#FF9A1F 100%);box-shadow:0 8px 22px rgba(255,138,0,.35)}
.bn-hero img{position:absolute;inset-inline-end:8px;bottom:-6px;width:116px;height:116px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(120,60,0,.35))}
.bn-hero h1{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.bn-hero p{margin:6px 0 0;font-size:16px;font-weight:600;line-height:1.35;max-width:20ch}
.bn-spark{position:absolute;color:#fff;opacity:.85;font-size:18px;pointer-events:none}
.bn-tools{display:flex;gap:8px;margin:0 0 14px}
.bn-tools button{flex:1;margin:0}
.bn-preview{background:#1F2A44;color:#fff;border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.bn-preview b{flex:1;font-size:15px;line-height:1.3}
.bn-preview button{width:auto;margin:0;padding:0 16px;height:40px}
.bn-sec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:19px;font-weight:800;color:#1F2A44}
.bn-sec .bn-count{background:#FF7A1A;color:#fff;border-radius:12px;font-size:14px;padding:1px 9px}
.bn-card{background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(31,42,68,.1);border:2px solid #FFE6B0}
.bn-row{display:flex;align-items:center;gap:12px}
.bn-tile{flex:none;width:68px;height:68px;border-radius:20px;display:grid;place-items:center}
.bn-tile img{width:50px;height:50px;object-fit:contain}
.bn-t{flex:1;min-width:0}.bn-t b{display:block;font-size:19px;line-height:1.2;color:#1F2A44}
.bn-t small{display:block;margin-top:3px;font-size:14px;color:#5B6478;line-height:1.3}
.bn-pts{flex:none;background:linear-gradient(180deg,#FFD84D,#FFB020);color:#5A3200;font-weight:800;font-size:19px;padding:6px 12px;border-radius:16px;box-shadow:inset 0 -3px 0 rgba(150,80,0,.25)}
.bn-go{display:block;width:100%;height:52px;margin:12px 0 0;border:0;border-radius:26px;font:inherit;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(180deg,#FF9A3D,#FF6A00);box-shadow:0 4px 0 #C95000;cursor:pointer}
.bn-go:active{transform:translateY(2px);box-shadow:0 2px 0 #C95000}
.bn-go[disabled]{opacity:.6}
.bn-chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 14px;border-radius:20px;font-weight:800;font-size:15px}
.bn-wait{background:#FFF3D1;color:#8A5A00}.bn-ok{background:#DCFCE7;color:#166534}.bn-no{background:#FEE2E2;color:#991B1B}
.bn-act{display:flex;gap:8px;margin-top:12px}.bn-act button{flex:1;margin:0}
.bn-off{opacity:.65}
.bn-empty{text-align:center;padding:22px 12px;color:#5B6478;font-weight:600;background:#fff;border-radius:22px;border:2px dashed #FFD27A}
.bn-empty img{width:72px;height:72px;display:block;margin:0 auto 6px;opacity:.9}
.bn-min{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(31,42,68,.08)}
.bn-min .bn-tile{width:44px;height:44px;border-radius:14px}.bn-min .bn-tile img{width:32px;height:32px}
.bn-min .bn-chip{margin:0;padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<main>
  <div id="prevBar" class="bn-preview hidden"><b>כך הילד רואה את העמוד. הדיווח כאן לא נשלח באמת.</b><button class="btn" id="prevOff" type="button">חזרה</button></div>
  <section class="bn-hero" aria-label="משימות בונוס">
    <span class="bn-spark" style="top:12px;inset-inline-end:132px">✦</span><span class="bn-spark" style="top:70px;inset-inline-end:150px;font-size:12px">✦</span><span class="bn-spark" style="bottom:12px;inset-inline-end:122px;font-size:14px">✦</span>
    <img src="icons/task/trophy.png" alt="">
    <h1>משימות בונוס</h1>
    <p>עשו משהו מיוחד וקבלו עוד נקודות</p>
  </section>
  <div id="adminBar" class="bn-tools hidden">
    <button class="btn" id="add" type="button">משימת בונוס חדשה</button>
    <button class="btn secondary" id="prevOn" type="button">איך הילד רואה</button>
  </div>
  <div id="pendBox" class="hidden">
    <div class="bn-sec">ממתינים לאישור <span class="bn-count" id="pendN"></span></div>
    <div id="pend"></div>
  </div>
  <div class="bn-sec">משימות פתוחות</div>
  <div id="open"><p class="empty">טוען...</p></div>
  <div id="adminBox" class="hidden">
    <div class="bn-sec">ניהול משימות בונוס</div>
    <div id="manage"></div>
  </div>
  <div class="bn-sec">הבונוסים שלי</div>
  <div id="mine"></div>
</main>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, avatar, showToast } from './js/common.js';
const { session, profiles, isAdmin } = await initPage({ active: 'bonus', title: 'משימות בונוס', back: 'index.html' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const me = session.user.id;
const $ = id => document.getElementById(id);
let tasks = [], claims = [], busy = false, kidView = false;

// אייקון וצבע למשימה: לפי מילה בשם, ואם אין התאמה לפי חישוב קבוע מהשם
const ICONS = ['trophy', 'soccer', 'broom', 'car', 'flower', 'dog', 'cat', 'bicycle', 'book-open', 'music', 'heart', 'wrench', 'shopping-bag', 'cooking-pot', 'recycle', 'washing-machine'];
const KEYS = [[/אוטו|רכב/, 'car'], [/כלב|טיול/, 'dog'], [/חתול/, 'cat'], [/כביס|בגד/, 'washing-machine'], [/מטבח|בישול|אוכל|ארוח/, 'cooking-pot'], [/ניקי|שטיפ|רצפ|מטאטא|אבק|שואב/, 'broom'], [/חצר|גינה|פרח|עציץ|להשק/, 'flower'], [/קניות|סופר/, 'shopping-bag'], [/ספר|לימוד|שיעור|קריאה/, 'book-open'], [/כדור|ספורט|משחק/, 'soccer'], [/אופניים/, 'bicycle'], [/מוזיק|שיר|פסנתר/, 'music'], [/מחזור|זבל|אשפה/, 'recycle'], [/תיקון|מברג|לתקן/, 'wrench']];
const TILES = ['#FFE3C2', '#FFD3E1', '#D6F5E3', '#E2DAFF', '#D4EBFF'];
const hash = t => [...t].reduce((a, c) => a + c.charCodeAt(0), 0);
const iconOf = t => (KEYS.find(([r]) => r.test(t.title)) || [0, ICONS[hash(t.title) % ICONS.length]])[1];
const tile = t => `<div class="bn-tile" style="background:${TILES[hash(t.title) % TILES.length]}"><img src="icons/task/${iconOf(t)}.png" alt=""></div>`;

const myClaim = t => claims.find(c => c.task_id === t.id && c.user_id === me && (c.status === 'pending' || c.status === 'approved'));
async function load() {
  const [t, c] = await Promise.all([
    supabase.from('bonus_tasks').select('*').order('created_at', { ascending: false }),
    supabase.from('bonus_claims').select('*').order('created_at', { ascending: false }).limit(200)
  ]);
  if (t.error || c.error) { $('open').innerHTML = '<p class="empty">לא הצלחנו לטעון</p>'; return; }
  tasks = t.data || []; claims = c.data || [];
  render();
}
const card = (t, extra, off) => `<div class="bn-card${off ? ' bn-off' : ''}"><div class="bn-row">${tile(t)}<div class="bn-t"><b>${esc(t.title)}</b>${t.description ? `<small>${esc(t.description)}</small>` : ''}</div><span class="bn-pts" dir="ltr">⭐ +${t.points}</span></div>${extra || ''}</div>`;
const empty = (txt) => `<div class="bn-empty"><img src="icons/task/trophy.png" alt="">${txt}</div>`;
function render() {
  const showAdmin = isAdmin && !kidView;
  $('prevBar').classList.toggle('hidden', !kidView);
  $('adminBar').classList.toggle('hidden', !showAdmin);
  $('adminBox').classList.toggle('hidden', !showAdmin);
  const act = tasks.filter(t => t.active);
  $('open').innerHTML = act.length ? act.map(t => {
    const c = kidView ? null : myClaim(t);
    const x = !c ? `<button class="bn-go" data-claim="${t.id}" type="button">ביצעתי!</button>`
      : c.status === 'pending' ? '<span class="bn-chip bn-wait">⏳ ממתין לאישור של הורה</span>' : '<span class="bn-chip bn-ok">✓ אושר, קיבלת את הנקודות</span>';
    return card(t, x);
  }).join('') : empty(isAdmin ? 'עוד אין משימות בונוס. צרו אחת בכפתור למעלה' : 'עוד אין משימות בונוס. כשהורה יוסיף אחת, היא תופיע כאן');

  const pend = showAdmin ? claims.filter(c => c.status === 'pending' && c.user_id !== me) : [];
  $('pendBox').classList.toggle('hidden', !pend.length);
  $('pendN').textContent = pend.length;
  $('pend').innerHTML = pend.map(c => `<div class="bn-card"><div class="bn-row">${avatar(byId[c.user_id], 48)}<div class="bn-t"><b>${esc(byId[c.user_id]?.name || 'מישהו')}</b><small>דיווח/ה: ${esc(c.title)}</small></div><span class="bn-pts" dir="ltr">⭐ +${c.points}</span></div>
    <div class="bn-act"><button class="btn" data-ok="${c.id}" type="button">אישור</button><button class="btn secondary" data-no="${c.id}" type="button">דחייה</button></div></div>`).join('');
  if (showAdmin) {
    $('manage').innerHTML = tasks.length ? tasks.map(t => card(t, `<div class="bn-act"><button class="btn secondary" data-tog="${t.id}" type="button">${t.active ? 'השבתה' : 'הפעלה'}</button><button class="btn secondary" data-del="${t.id}" type="button">מחיקה</button></div>${t.active ? '' : '<div class="note" style="margin-top:8px">המשימה מושבתת ולא מוצגת לאחרים</div>'}`, !t.active)).join('') : empty('עוד לא יצרתם משימות בונוס');
  }
  const mine = kidView ? [] : claims.filter(c => c.user_id === me);
  const st = { pending: ['⏳ ממתין לאישור', 'bn-wait'], approved: ['✓ אושר', 'bn-ok'], rejected: ['נדחה', 'bn-no'] };
  $('mine').innerHTML = mine.length ? mine.map(c => { const t = { title: c.title }; return `<div class="bn-min">${tile(t)}<div class="bn-t"><b style="font-size:16px">${esc(c.title)}</b></div><span class="bn-chip ${st[c.status][1]}">${st[c.status][0]}</span><span class="bn-pts" dir="ltr" style="font-size:15px;padding:4px 9px">${c.status === 'approved' ? '+' : ''}${c.points}</span></div>`; }).join('') : empty('עוד לא דיווחתם על משימות בונוס');
}
$('prevOn').onclick = () => { kidView = true; render(); window.scrollTo(0, 0); };
$('prevOff').onclick = () => { kidView = false; render(); window.scrollTo(0, 0); };
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  const act = async (fn, okMsg, failMsg) => {
    busy = true; b.disabled = true;
    try { const { error } = await fn(); if (error) throw error; if (okMsg) showToast(okMsg); await load(); }
    catch (_) { showToast(failMsg, true); b.disabled = false; }
    busy = false;
  };
  if (b.dataset.claim) { if (kidView) return showToast('זו תצוגה מקדימה, הדיווח לא נשלח'); return act(() => supabase.rpc('claim_bonus', { p_task: b.dataset.claim }), 'הדיווח נשלח להורים', 'לא הצלחנו לשלוח, אולי כבר דיווחת'); }
  if (b.dataset.ok) return act(() => supabase.rpc('decide_bonus_claim', { p_claim: b.dataset.ok, p_ok: true }), 'אושר. הנקודות נוספו', 'האישור נכשל');
  if (b.dataset.no) return act(() => supabase.rpc('decide_bonus_claim', { p_claim: b.dataset.no, p_ok: false }), 'הדיווח נדחה', 'הפעולה נכשלה');
  if (b.dataset.tog) { const t = tasks.find(x => x.id === b.dataset.tog); return act(() => supabase.from('bonus_tasks').update({ active: !t.active }).eq('id', t.id).select('id').then(r => (!r.error && !r.data?.length) ? { error: 1 } : r), null, 'העדכון נכשל'); }
  if (b.dataset.del) {
    const t = tasks.find(x => x.id === b.dataset.del);
    $('modalCard').innerHTML = `<h3 style="margin:0 0 8px">למחוק את המשימה?</h3><p class="note" style="text-align:start">"${esc(t.title)}" תימחק. דיווחים שכבר נשלחו וממתינים לאישור יישארו.</p><button type="button" class="btn" id="dYes" style="background:#E5484D">מחיקה</button><button type="button" class="btn secondary" id="dNo">ביטול</button>`;
    $('modal').classList.remove('hidden');
    $('dNo').onclick = () => $('modal').classList.add('hidden');
    $('dYes').onclick = async () => {
      $('dYes').disabled = true;
      const { data, error } = await supabase.from('bonus_tasks').delete().eq('id', t.id).select('id');
      if (error || !data?.length) { $('dYes').disabled = false; return showToast('המחיקה נכשלה', true); }
      $('modal').classList.add('hidden'); showToast('המשימה נמחקה'); load();
    };
  }
});
$('add').addEventListener('click', () => {
  $('modalCard').innerHTML = `<h3 style="margin:0 0 8px">משימת בונוס חדשה</h3>
    <label for="bt">שם המשימה</label><input id="bt" type="text" maxlength="80" placeholder="למשל: לשטוף את האוטו">
    <label for="bd">פרטים (לא חובה)</label><input id="bd" type="text" maxlength="200">
    <label for="bp">נקודות</label><input id="bp" type="number" min="1" inputmode="numeric" value="10">
    <p class="err" id="be" style="color:#C2410C;margin:6px 0 0"></p>
    <button type="button" class="btn" id="bs">יצירה</button><button type="button" class="btn secondary" id="bc">ביטול</button>`;
  $('modal').classList.remove('hidden');
  $('bc').onclick = () => $('modal').classList.add('hidden');
  $('bs').onclick = async () => {
    const title = $('bt').value.trim(), points = parseInt($('bp').value);
    if (!title) { $('be').textContent = 'צריך שם למשימה'; return; }
    if (!(points > 0)) { $('be').textContent = 'צריך מספר נקודות גדול מאפס'; return; }
    $('bs').disabled = true;
    const { error } = await supabase.from('bonus_tasks').insert({ title, description: $('bd').value.trim() || null, points });
    if (error) { $('bs').disabled = false; $('be').textContent = 'היצירה נכשלה, אפשר לנסות שוב'; return; }
    $('modal').classList.add('hidden'); showToast('משימת הבונוס נוצרה'); load();
  };
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });
await load();
setInterval(() => { if (!document.hidden && $('modal').classList.contains('hidden')) load(); }, 30000);
</script>
</body>
</html>
