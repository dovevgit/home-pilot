<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | משימות בונוס</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="pendBox" class="hidden">
    <div class="sec-title" style="margin-top:0">ממתינים לאישור</div>
    <div id="pend"></div>
  </div>
  <div class="sec-title" id="openTitle" style="margin-top:0">משימות בונוס פתוחות</div>
  <div id="open"><p class="empty">טוען...</p></div>
  <div id="adminBox" class="hidden">
    <button class="btn" id="add" type="button">משימת בונוס חדשה</button>
    <div class="sec-title" style="margin-top:22px">ניהול משימות בונוס</div>
    <div id="manage"></div>
  </div>
  <div class="sec-title" style="margin-top:22px">הבונוסים שלי</div>
  <div id="mine"></div>
</main>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, avatar, showToast } from './js/common.js';
const { session, profiles, isAdmin } = await initPage({ active: 'bonus', title: 'משימות בונוס', back: 'index.html' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const me = session.user.id;
const $ = id => document.getElementById(id);
let tasks = [], claims = [], busy = false;

const myClaim = t => claims.find(c => c.task_id === t.id && c.user_id === me && (c.status === 'pending' || c.status === 'approved'));
async function load() {
  const [t, c] = await Promise.all([
    supabase.from('bonus_tasks').select('*').order('created_at', { ascending: false }),
    supabase.from('bonus_claims').select('*').order('created_at', { ascending: false }).limit(200)
  ]);
  if (t.error || c.error) { $('open').innerHTML = '<p class="empty">לא הצלחנו לטעון</p>'; return; }
  tasks = t.data || []; claims = c.data || [];
  render();
}
const taskCard = (t, extra) => `<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><b style="font-size:18px">${esc(t.title)}</b>${t.description ? `<div class="note" style="text-align:start;margin:2px 0 0">${esc(t.description)}</div>` : ''}</div><span class="pts" dir="ltr">+${t.points}</span></div>${extra || ''}</div>`;
function render() {
  const act = tasks.filter(t => t.active);
  $('open').innerHTML = act.length ? act.map(t => {
    const c = myClaim(t);
    const btn = !c ? `<button class="btn" data-claim="${t.id}" type="button" style="margin-top:10px">ביצעתי</button>`
      : c.status === 'pending' ? '<div class="note" style="margin-top:10px">ממתין לאישור של הורה</div>' : '<div class="note" style="margin-top:10px;color:#15803D;font-weight:800">✓ אושר וקיבלת את הנקודות</div>';
    return taskCard(t, btn);
  }).join('') : '<p class="empty">אין כרגע משימות בונוס</p>';

  if (isAdmin) {
    $('adminBox').classList.remove('hidden');
    const pend = claims.filter(c => c.status === 'pending' && c.user_id !== me);
    $('pendBox').classList.toggle('hidden', !pend.length);
    $('pend').innerHTML = pend.map(c => `<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px">${avatar(byId[c.user_id], 40)}<div style="flex:1;min-width:0"><b>${esc(byId[c.user_id]?.name || 'מישהו')}</b> דיווח/ה: ${esc(c.title)}</div><span class="pts" dir="ltr">+${c.points}</span></div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-ok="${c.id}" type="button" style="flex:1;margin:0">אישור</button><button class="btn secondary" data-no="${c.id}" type="button" style="flex:1;margin:0">דחייה</button></div></div>`).join('');
    $('manage').innerHTML = tasks.length ? tasks.map(t => taskCard(t, `<div style="display:flex;gap:8px;margin-top:10px"><button class="btn secondary" data-tog="${t.id}" type="button" style="flex:1;margin:0">${t.active ? 'השבתה' : 'הפעלה'}</button><button class="btn secondary" data-del="${t.id}" type="button" style="flex:1;margin:0">מחיקה</button></div>${t.active ? '' : '<div class="note" style="margin-top:6px">המשימה מושבתת ולא מוצגת לאחרים</div>'}`)).join('') : '<p class="empty">עוד לא יצרתם משימות בונוס</p>';
  }
  const mine = claims.filter(c => c.user_id === me);
  const st = { pending: 'ממתין לאישור', approved: 'אושר', rejected: 'נדחה' };
  $('mine').innerHTML = mine.length ? mine.map(c => `<div class="row-item" style="align-items:center"><div style="flex:1;min-width:0"><b>${esc(c.title)}</b><div class="note" style="text-align:start;margin:0">${st[c.status]}</div></div><span class="pts" dir="ltr">${c.status === 'approved' ? '+' + c.points : c.points}</span></div>`).join('') : '<p class="empty">עוד לא דיווחתם על משימות בונוס</p>';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  const act = async (fn, okMsg, failMsg) => {
    busy = true; b.disabled = true;
    try { const { error } = await fn(); if (error) throw error; if (okMsg) showToast(okMsg); await load(); }
    catch (_) { showToast(failMsg, true); b.disabled = false; }
    busy = false;
  };
  if (b.dataset.claim) return act(() => supabase.rpc('claim_bonus', { p_task: b.dataset.claim }), 'הדיווח נשלח להורים', 'לא הצלחנו לשלוח, אולי כבר דיווחת');
  if (b.dataset.ok) return act(() => supabase.rpc('decide_bonus_claim', { p_claim: b.dataset.ok, p_ok: true }), 'אושר. הנקודות נוספו', 'האישור נכשל');
  if (b.dataset.no) return act(() => supabase.rpc('decide_bonus_claim', { p_claim: b.dataset.no, p_ok: false }), 'הדיווח נדחה', 'הפעולה נכשלה');
  if (b.dataset.tog) { const t = tasks.find(x => x.id === b.dataset.tog); return act(() => supabase.from('bonus_tasks').update({ active: !t.active }).eq('id', t.id).select('id').then(r => (!r.error && !r.data?.length) ? { error: 1 } : r), null, 'העדכון נכשל'); }
  if (b.dataset.del) {
    const t = tasks.find(x => x.id === b.dataset.del);
    $('modalCard').innerHTML = `<h3 style="margin:0 0 8px">למחוק את המשימה?</h3><p class="note" style="text-align:start">"${esc(t.title)}" תימחק. דיווחים שכבר נשלחו וממתינים לאישור יישארו.</p><button type="button" class="btn" id="dYes" style="background:#E5484D">מחיקה</button><button type="button" class="btn secondary" id="dNo">ביטול</button>`;
    $('modal').classList.remove('hidden');
    $('dNo').onclick = () => $('modal').classList.add('hidden');
    $('dYes').onclick = async () => {
      $('dYes').disabled = true;
      const { data, error } = await supabase.from('bonus_tasks').delete().eq('id', t.id).select('id');
      if (error || !data?.length) { $('dYes').disabled = false; return showToast('המחיקה נכשלה', true); }
      $('modal').classList.add('hidden'); showToast('המשימה נמחקה'); load();
    };
  }
});
$('add').addEventListener('click', () => {
  $('modalCard').innerHTML = `<h3 style="margin:0 0 8px">משימת בונוס חדשה</h3>
    <label for="bt">שם המשימה</label><input id="bt" type="text" maxlength="80" placeholder="למשל: לשטוף את האוטו">
    <label for="bd">פרטים (לא חובה)</label><input id="bd" type="text" maxlength="200">
    <label for="bp">נקודות</label><input id="bp" type="number" min="1" inputmode="numeric" value="10">
    <p class="err" id="be" style="color:#C2410C;margin:6px 0 0"></p>
    <button type="button" class="btn" id="bs">יצירה</button><button type="button" class="btn secondary" id="bc">ביטול</button>`;
  $('modal').classList.remove('hidden');
  $('bc').onclick = () => $('modal').classList.add('hidden');
  $('bs').onclick = async () => {
    const title = $('bt').value.trim(), points = parseInt($('bp').value);
    if (!title) { $('be').textContent = 'צריך שם למשימה'; return; }
    if (!(points > 0)) { $('be').textContent = 'צריך מספר נקודות גדול מאפס'; return; }
    $('bs').disabled = true;
    const { error } = await supabase.from('bonus_tasks').insert({ title, description: $('bd').value.trim() || null, points });
    if (error) { $('bs').disabled = false; $('be').textContent = 'היצירה נכשלה, אפשר לנסות שוב'; return; }
    $('modal').classList.add('hidden'); showToast('משימת הבונוס נוצרה'); load();
  };
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });
await load();
setInterval(() => { if (!document.hidden && $('modal').classList.contains('hidden')) load(); }, 30000);
</script>
</body>
</html>
