<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('lang')==='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | שיעורי אנגלית</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.ls{margin-bottom:12px}
.ls h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:0 0 6px}
.ls .when{color:#6b7280;font-weight:600;font-size:14px}
.ls .sum{font-size:17px;line-height:1.5;margin:4px 0 10px}
.ls .acts{display:flex;gap:8px;flex-wrap:wrap}
.ls .acts button{font:inherit;font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer;border:2px solid #0D6EFD;background:#fff;color:#0A58CA}
.ls .acts .del{border-color:#DC2626;color:#B91C1C}
.op{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:10px 14px;margin:0 0 10px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.op b{display:block;color:#166534;margin-bottom:2px}
.tr{margin-top:12px;border-top:1px solid #E2E8F0;padding-top:8px}
.tr .q,.tr .a{padding:8px 12px;border-radius:12px;margin:6px 0;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tr .q{background:#E8F3FF}
.tr .a{background:#FFF3A8}
.tr .who{display:block;font-size:13px;font-weight:700;color:#6b7280;margin-bottom:2px}
</style>
</head>
<body>
<main>
  <p class="empty" id="msg">טוען...</p>
  <div id="list"></div>
</main>
<script type="module">
import { initPage, supabase, esc, showToast } from './js/common.js';
const { me, isAdmin } = await initPage({ active: 'lessons', title: 'שיעורי אנגלית', back: 'index.html', menu: false });
// רק הורים
if (!isAdmin) { location.replace('index.html'); await new Promise(() => {}); }
const $ = id => document.getElementById(id);
const open = new Set();
let rows = [];
const fmt = d => new Intl.DateTimeFormat('he-IL', { timeZone: 'Asia/Jerusalem', weekday: 'long', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(d));
const clean = t => String(t || '').replace(/\s*\[\[say:[^\]]*\]\]/g, '');

function draw() {
  $('msg').classList.toggle('hidden', rows.length > 0);
  if (!rows.length) $('msg').textContent = 'עוד אין שיעורים';
  $('list').innerHTML = rows.map(r => {
    const isOpen = open.has(r.id);
    const tr = isOpen ? `<div class="tr">${(r.messages || []).map(m => `<div class="${m.role === 'user' ? 'a' : 'q'}"><span class="who">${m.role === 'user' ? 'תלמיד/ה' : 'מורה'}</span>${esc(clean(m.content))}</div>`).join('')}</div>` : '';
    return `<section class="card ls"><h3><span>${esc(r.user_name || '')} סיים שיעור אנגלית</span><span class="when">${esc(fmt(r.created_at))}</span></h3>
      <p class="sum">${r.summary ? esc(r.summary) : 'אין סיכום לשיעור הזה'}</p>${r.opinion ? `<div class="op"><b>חוות דעת של המורה</b>${esc(r.opinion)}</div>` : ''}
      <div class="acts"><button type="button" data-v="${r.id}">${isOpen ? 'הסתר שיעור' : 'הצג שיעור'}</button><button type="button" class="del" data-d="${r.id}">מחיקת השיעור</button></div>${tr}</section>`;
  }).join('');
  $('list').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const id = b.dataset.v; open.has(id) ? open.delete(id) : open.add(id); draw(); });
  $('list').querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    if (!confirm('למחוק את השיעור? השיעור יימחק ולא ניתן יהיה לשחזר אותו.')) return;
    const { error } = await supabase.from('ai_lessons').delete().eq('id', b.dataset.d);
    if (error) { showToast('המחיקה נכשלה', true); return; }
    rows = rows.filter(r => r.id !== b.dataset.d); showToast('השיעור נמחק'); draw();
  });
}
async function load() {
  const { data, error } = await supabase.from('ai_lessons').select('id,user_name,messages,summary,opinion,created_at').order('created_at', { ascending: false }).limit(50);
  if (error) { $('msg').textContent = 'לא הצלחנו לטעון'; return; }
  rows = data || []; draw();
}
await load();
</script>
</body>
</html>
